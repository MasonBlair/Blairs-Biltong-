<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dispatch — Blair's Biltong</title>
<link rel="icon" href="assets/blairs-logo.png">
<link rel="apple-touch-icon" href="assets/dispatch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dispatch">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#241b13">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#241b13;--ink-2:#150e07;--bg:#f2ece1;--card:#fffcf6;--line:rgba(36,27,19,.09);--line-2:rgba(36,27,19,.16);
  --muted:#7a6a55;--faint:#a3937c;--cream:#f7f1e4;--gold:#b9873c;--gold-2:#9c6f2c;--gold-soft:rgba(185,135,60,.13);
  --ok:#3d6a37;--ok-soft:#e5ede0;--warn:#9a6114;--warn-soft:#f6e9d2;--bad:#9a3324;--bad-soft:#f5e0db;--info:#4b5f73;--info-soft:#e4e9ee;
  --r:12px;--tab-h:62px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 'Barlow',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:var(--ink);padding:calc(10px + var(--sat)) 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
header img{width:34px;height:auto}
header h1{margin:0;font:600 16px/1 'Oswald',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cream)}
header .sp{flex:1}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:#d8c7a8}
.icon-btn:active{background:rgba(255,255,255,.08)}
.icon-btn svg{width:21px;height:21px}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{max-width:680px;margin:0 auto;padding:14px 14px calc(var(--tab-h) + var(--sab) + 28px)}

/* ---------- tab bar ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,252,246,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--sab)}
nav.tabs .in{display:flex;width:100%;max-width:680px}
nav.tabs button{flex:1;height:var(--tab-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--faint);font:500 10.5px/1 'Barlow',sans-serif;letter-spacing:0;position:relative;min-width:0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"]::before{content:'';position:absolute;top:0;left:28%;right:28%;height:2px;background:var(--gold);border-radius:0 0 2px 2px}
nav.tabs .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--ink-2);font:600 10.5px/17px 'Barlow',sans-serif}

/* ---------- building blocks ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.flush{padding:0;overflow:hidden}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 9px}
.sec h2{margin:0;font:600 12px/1 'Oswald',sans-serif;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
.sec a,.sec button.link{font-size:13px;color:var(--gold-2);font-weight:600;text-decoration:none;background:none;border:0;padding:0}
.hello{font:500 13px/1 'Barlow',sans-serif;color:var(--muted);margin:4px 2px 12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;text-align:left;width:100%}
button.stat:active{background:#fbf6ec}
.stat .k{font-size:12.5px;color:var(--muted);display:block}
.stat .v{font:600 25px/1.15 'Oswald',sans-serif;letter-spacing:.01em;display:block;margin-top:5px}
.stat .s{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.big{font:600 34px/1 'Oswald',sans-serif}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:12px}
.ok-t{color:var(--ok)}.warn-t{color:var(--warn)}.bad-t{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb0{margin-bottom:0}

.list .it{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list .it:first-child{border-top:0}
button.it:active{background:#fbf6ec}
.it .main{flex:1;min-width:0}
.it .t,.it .d{display:block}
.it .t{font-weight:600;line-height:1.3}
.it .d{font-size:13px;color:var(--muted);line-height:1.35;margin-top:1px}
.it .end{text-align:right;flex-shrink:0}
.chev{width:16px;height:16px;color:var(--faint);flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--info)}
.dot.warn{background:#d39a3f}.dot.bad{background:var(--bad)}.dot.ok{background:var(--ok)}

.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font:600 11.5px/1 'Barlow',sans-serif;letter-spacing:.02em;white-space:nowrap;background:var(--info-soft);color:var(--info)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.gold{background:var(--gold-soft);color:var(--gold-2)}.chip.plain{background:#efe8da;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid transparent;
  font:600 13px/1 'Oswald',sans-serif;letter-spacing:.11em;text-transform:uppercase;background:var(--gold);color:var(--ink-2)}
.btn:active{filter:brightness(.95)}
.btn.sec2{background:var(--card);border-color:var(--line-2);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--cream)}
.btn.danger{background:var(--bad);color:#fff}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted);text-transform:none;letter-spacing:0;font:500 14px/1 'Barlow',sans-serif;text-decoration:underline;min-height:40px}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:17px;height:17px}
.btns{display:flex;gap:8px}.btns>.btn{flex:1;white-space:nowrap;padding:0 10px}

.seg{display:flex;background:#e7dfd0;border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;height:34px;border-radius:8px;font:600 13px/1 'Barlow',sans-serif;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(36,27,19,.12)}

/* stock tiles */
.flav-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.flav-head h3{margin:0;font:600 18px/1 'Oswald',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.tile{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 8px 10px;text-align:center;width:100%;position:relative}
.tile:active{background:#fbf6ec}
.tile .g{font:600 12px/1 'Oswald',sans-serif;letter-spacing:.12em;color:var(--muted)}
.tile .n{font:600 30px/1.1 'Oswald',sans-serif;margin:6px 0 3px}
.tile .l{font-size:11.5px;color:var(--faint);line-height:1.2;min-height:14px}
.tile.low{border-color:#e7c48b;background:#fdf6e9}.tile.low .n{color:var(--warn)}
.tile.out{border-color:#e9bfb6;background:#fcf1ee}.tile.out .n{color:var(--bad)}
.tile.off{opacity:.55}

.bar{height:6px;background:#ece4d5;border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:3px}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:#d39a3f}.bar.bad>i{background:var(--bad)}

/* batch stepper */
.steps{display:flex;gap:4px;margin:12px 0 4px}
.steps i{flex:1;height:5px;border-radius:3px;background:#e7dfd0}
.steps i.on{background:var(--gold)}
.steps-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint)}
.steps-l span.on{color:var(--ink);font-weight:600}
.code{font:600 13px/1 'Oswald',sans-serif;letter-spacing:.14em;color:var(--gold-2)}
.btitle{font:600 18px/1.2 'Oswald',sans-serif;letter-spacing:.03em;margin:5px 0 2px}

/* chart */
.chart{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:8px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.chart .c i{display:block;width:100%;max-width:26px;background:#e2cfa9;border-radius:4px 4px 1px 1px;min-height:2px}
.chart .c.now i{background:var(--gold)}
.chart .c span{font-size:10.5px;color:var(--faint);white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;margin:10px 0}
.hbar .bar{grid-column:1/-1;height:7px}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font:600 11px/1 'Oswald',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 0 8px;font-weight:600}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:9px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap}

/* forms */
label.f{display:block;font:600 11.5px/1 'Oswald',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 7px}
label.f:first-child{margin-top:4px}
input.in,select.in,textarea.in{width:100%;min-height:46px;padding:11px 12px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:16px}
textarea.in{min-height:70px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.choices{display:flex;flex-wrap:wrap;gap:7px}
.choices button{min-height:38px;padding:0 13px;border-radius:19px;border:1px solid var(--line-2);background:#fff;font:500 14px/1 'Barlow',sans-serif}
.choices button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.stepper{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;background:#fff;overflow:hidden;height:46px}
.stepper button{width:46px;height:100%;border:0;background:#faf6ee;font-size:20px;color:var(--ink)}
.stepper input{flex:1;min-width:0;height:100%;border:0;text-align:center;font:600 18px/1 'Oswald',sans-serif;background:transparent}
.stepper input:focus{outline:none}
.packrow{display:grid;grid-template-columns:1fr 150px;align-items:center;gap:10px;margin-top:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-child{border-top:0}
.switch input[type=checkbox]{appearance:none;width:48px;height:28px;border-radius:14px;background:#d9cfbd;position:relative;flex-shrink:0;transition:background .2s;cursor:pointer;margin:0}
.switch input[type=checkbox]::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .2s}
.switch input[type=checkbox]:checked{background:var(--ok)}
.switch input[type=checkbox]:checked::after{left:23px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--ink);margin:1px 0 0;flex-shrink:0}
.err{color:var(--bad);font-size:13.5px;font-weight:600;min-height:18px;margin-top:10px}

/* orders (dispatch) */
.order .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.order .ref{font:600 13px/1 'Oswald',sans-serif;letter-spacing:.14em;color:var(--gold-2)}
.order .name{font:600 19px/1.2 'Oswald',sans-serif;margin:6px 0 2px}
.order ul{margin:8px 0;padding-left:18px}
.order .addr{color:var(--muted);font-size:14px}
.order input.trk{font:600 18px/1 'Oswald',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.msg{margin-top:10px;font-size:14px;font-weight:600}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.order.shipped{opacity:.8}
details.more>summary{list-style:none;cursor:pointer;margin:22px 2px 9px;font:600 12px/1 'Oswald',sans-serif;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:' +';color:var(--faint)}
details.more[open]>summary::after{content:' −'}

.empty{text-align:center;color:var(--muted);padding:26px 14px;font-size:14px}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,#ebe3d4,#f3ecdf,#ebe3d4);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.note{background:var(--gold-soft);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.45}
.note.info{background:var(--info-soft)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(21,14,7,.42);opacity:0;transition:opacity .22s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - 40px - var(--sat));display:flex;flex-direction:column;
  background:var(--bg);border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-width:680px;margin:0 auto}
.sheet.on{transform:none}
.sheet .sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);position:relative}
.sheet .sh-h::before{content:'';position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:#d4c9b6}
.sheet .sh-h h3{margin:6px 0 0;font:600 17px/1.2 'Oswald',sans-serif;letter-spacing:.06em;text-transform:uppercase;flex:1}
.sheet .sh-h .icon-btn{color:var(--muted);margin-top:4px}
.sheet .sh-b{overflow:auto;padding:16px 16px calc(20px + var(--sab));-webkit-overflow-scrolling:touch}
.sheet .sh-f{position:sticky;bottom:calc(-20px - var(--sab));background:var(--bg);padding:14px 0 calc(20px + var(--sab));margin-top:10px;box-shadow:0 -10px 14px -10px rgba(36,27,19,.18)}

.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--sab) + 14px);transform:translate(-50%,20px);z-index:60;background:var(--ink);color:var(--cream);
  border-radius:12px;padding:12px 14px 12px 16px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.22s;max-width:calc(100% - 28px);box-shadow:0 8px 24px rgba(21,14,7,.25)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.bad{background:var(--bad)}
.toast button{border:0;background:none;color:var(--gold);font:600 13px/1 'Oswald',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:4px}


/* ---------- safety records ---------- */
.due{border-color:#e7c48b;background:#fdf6e9;padding:4px 14px}
.due-it{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid rgba(154,97,20,.15)}
.due-it:first-child{border-top:0}
.due-it .main{flex:1;min-width:0}.due-it .t{font-weight:600}.due-it .d{font-size:12.5px;color:var(--warn)}
.due-it .btn.quiet{min-height:36px;padding:0 4px;font-size:13px}
.qlog{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:108px}
.qlog:active{background:#fbf6ec}
.qlog .ql-i{width:36px;height:36px;border-radius:10px;background:var(--gold-soft);color:var(--gold-2);display:grid;place-items:center;margin-bottom:6px}
.qlog .ql-i svg{width:21px;height:21px}
.qlog .ql-t{font:600 15px/1.2 'Oswald',sans-serif;letter-spacing:.04em;text-transform:uppercase}
.qlog .ql-s{font-size:12.5px;color:var(--muted);line-height:1.3}
.qlog.warnb{border-color:#e9bfb6}.qlog.warnb .ql-i{background:var(--bad-soft);color:var(--bad)}.qlog.warnb .ql-s{color:var(--bad);font-weight:600}
svg.spark{width:100%;height:auto;display:block;margin-bottom:6px}
.tick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:15px;line-height:1.35}
.tick .box{width:28px;height:28px;border-radius:8px;border:2px solid #cbbda3;display:grid;place-items:center;flex-shrink:0;color:transparent;transition:.15s}
.tick .box svg{width:18px;height:18px}
.tick.on{border-color:#c9a878;background:#fdf8ef}
.tick.on .box{background:var(--gold);border-color:var(--gold);color:var(--ink-2)}
.crit{display:inline-block;font:600 10px/1 'Barlow',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--bad);background:var(--bad-soft);padding:3px 6px;border-radius:6px;vertical-align:2px;margin-left:4px}
.lim{font:500 11.5px/1 'Barlow',sans-serif;letter-spacing:0;text-transform:none;color:var(--faint)}
.numrow{display:flex;align-items:center;gap:8px}.numrow .in{max-width:140px;font-size:17px;font-weight:600}
.numrow .u{color:var(--muted);font-size:14px}
.numrow.bad .in{border-color:var(--bad);background:#fdf3f1}.numrow.ok .in{border-color:#a9c4a2}
.live{font-size:12.5px;font-weight:600;margin-left:auto}.live.ok{color:var(--ok)}.live.bad{color:var(--bad)}
div.live{margin-top:8px;text-align:center}
.bignum{display:flex;align-items:center;background:#fff;border:2px solid var(--line-2);border-radius:16px;overflow:hidden;height:84px}
.bignum button{width:72px;height:100%;border:0;background:#faf6ee;font-size:28px}
.bignum input{flex:1;min-width:0;border:0;text-align:right;font:600 44px/1 'Oswald',sans-serif;background:transparent;padding:0}
.bignum input:focus{outline:none}.bignum .u{font:500 20px/1 'Oswald',sans-serif;color:var(--muted);padding:0 14px 0 4px}
.bignum.ok{border-color:#86ad7e;background:#f6faf4}.bignum.bad{border-color:var(--bad);background:#fdf3f1}
.info-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;background:var(--gold-soft);border-radius:10px;padding:11px 13px;margin-top:12px;font-size:14px}
.info-row b{text-align:right}
.clist{background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:6px 12px 8px}
.cl-head,.cl-row{display:grid;grid-template-columns:1fr 64px 64px;align-items:center;gap:6px}
.cl-head{font:600 10.5px/1 'Oswald',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:6px 0}
.cl-row{padding:7px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.3}
.mini{width:36px;height:36px;margin:0 auto;border-radius:9px;border:2px solid #cbbda3;background:#fff;color:transparent;display:grid;place-items:center}
.mini svg{width:20px;height:20px}.mini.on{background:var(--gold);border-color:var(--gold);color:var(--ink-2)}
span.mini{width:24px;height:24px;border-radius:7px;margin:0;flex-shrink:0}span.mini svg{width:15px;height:15px}span.mini.on{background:var(--ok);border-color:var(--ok);color:#fff}
.slices{background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:6px 10px}
.sl-h,.sl-r{display:grid;grid-template-columns:22px 1fr 1fr 1fr 58px;gap:6px;align-items:center}
.sl-h{font:600 10.5px/1 'Oswald',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 0;text-align:center}
.sl-r{padding:4px 0;border-top:1px solid var(--line)}.sl-r .n{font-size:12px;color:var(--faint);text-align:center}
.sl-r input{width:100%;height:38px;border:1px solid var(--line-2);border-radius:8px;text-align:center;font-size:16px;min-width:0;padding:0}
.sl-r input:focus{outline:2px solid var(--gold);border-color:transparent}
.loss{font:600 14px/1 'Oswald',sans-serif;text-align:center}.loss.ok{color:var(--ok)}.loss.bad{color:var(--bad)}
.sdot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex-shrink:0;font:600 12px/1 'Oswald',sans-serif;color:var(--faint);background:#fff}
.sdot svg{width:16px;height:16px}.sdot.ok{background:var(--ok);border-color:var(--ok);color:#fff}.sdot.bad{background:var(--bad);border-color:var(--bad);color:#fff;font-size:15px}.sdot.part{background:var(--warn-soft);border-color:#e7c48b;color:var(--warn)}
.rel{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px;color:var(--muted)}.rel.ok{color:var(--ink)}
.tick .amt{font:600 17px/1 'Oswald',sans-serif;white-space:nowrap}
.timebox{background:var(--gold-soft);border-radius:10px;padding:6px 12px;margin-top:10px}
.timebox b{white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.kv:first-child{border-top:0}.kv>span:last-child{text-align:right}
.choices.days button{min-width:44px;padding:0 10px}
.sheet .sh-h .back{margin:4px -4px 0 -6px;color:var(--ink)}

.pp{background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:4px 14px 12px}
.pp-top{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:10px 0}.pp-top>div{display:flex;flex-direction:column;gap:2px}
.pp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px -14px 4px;padding:8px 14px;background:#f2ece1;font:600 12.5px/1.2 'Oswald',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.pp-sig{font:500 11.5px/1 'Barlow',sans-serif;letter-spacing:0;text-transform:none;color:var(--muted);white-space:nowrap}
.pp-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dotted var(--line-2);font-size:14px}
.pp-row>span:first-child{color:var(--muted)}.pp-row>span:last-child{text-align:right}
.pp-blank{color:#c9bca6}.pp-y{color:var(--ok)}.pp-n{color:var(--bad)}.pp-ok{color:var(--ok);font-weight:700}.pp-bad{color:var(--bad);font-weight:700}
.pp-note{font-size:13.5px;background:var(--gold-soft);border-radius:8px;padding:8px 10px;margin:6px 0}
.pp-t{font-size:13px;margin:4px 0}.pp-t th,.pp-t td{text-align:center!important;padding:5px 2px}
.al{gap:10px}.al-go{background:none;border:0;padding:0;text-align:left;flex:1;min-width:0}
.al-btn{min-height:34px;flex-shrink:0}.btn.quiet.al-btn{text-decoration:none;color:var(--gold-2);font-weight:600;padding:0 6px}
.al-noted{opacity:.6}
/* ---------- login ---------- */
#login{max-width:380px;margin:9vh auto 0}
#login .card{padding:22px}
#login h2{font:600 20px/1.2 'Oswald',sans-serif;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
</style>
</head>
<body>
<header>
  <img src="assets/blairs-logo.png" alt="">
  <h1 id="title">Dispatch</h1>
  <span class="sp"></span>
  <button class="icon-btn hide" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  <button class="icon-btn hide" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg></button>
</header>

<main>
  <section id="login">
    <div class="card">
      <h2>Boss login</h2>
      <p class="muted small" style="margin:0 0 14px">Orders, stock, batches and numbers for Blair’s Biltong.</p>
      <label class="f" for="pw">Dispatch password</label>
      <input class="in" id="pw" type="password" autocomplete="current-password">
      <button class="btn full mt" id="go">Open</button>
      <div class="err" id="loginMsg"></div>
    </div>
  </section>
  <section id="view" class="hide"></section>
</main>

<nav class="tabs hide" id="tabs"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11.5h13V9"/><path d="M10 20.5v-6h4v6"/></svg>Today</button>
  <button data-tab="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5h11v10h-11z"/><path d="M13.5 10h4l3 3.2v3.3h-7"/><circle cx="6.5" cy="17.8" r="1.8"/><circle cx="17" cy="17.8" r="1.8"/></svg>Orders<span class="badge hide" id="shipBadge"></span></button>
  <button data-tab="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5 12 3.5l8.5 4v9L12 20.5l-8.5-4z"/><path d="M3.5 7.5 12 11.5l8.5-4M12 11.5v9"/></svg>Stock</button>
  <button data-tab="batches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.5 8.5 4.5-8.5 4.5L3.5 8z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5"/><path d="m3.5 16.5 8.5 4 8.5-4"/></svg>Batches</button>
  <button data-tab="safety"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 19.5 6v5.6c0 4.4-3.1 8.1-7.5 9.2-4.4-1.1-7.5-4.8-7.5-9.2V6z"/><path d="m8.8 12.2 2.3 2.3 4.3-4.6"/></svg>Safety<span class="badge hide" id="fsBadge"></span></button>
  <button data-tab="numbers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20.5h18"/><path d="M6 20.5v-7M11 20.5V6.5M16 20.5v-10M20.5 20.5V3.5" /></svg>Numbers</button>
</div></nav>

<div class="scrim hide" id="scrim"></div>
<div class="sheet hide" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh-h"><button class="icon-btn back hide" id="shBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button><h3 id="shTitle"></h3><button class="icon-btn" data-do="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="sh-b" id="shBody"></div>
</div>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastAct" class="hide"></button></div>

<script>
/* =========================================================================
   Blair's Biltong — boss dashboard
   Talks to /api/boss (stock, batches, supplies, numbers) and /api/orders +
   /api/mark-shipped (dispatch). Same password for all of it.
   ========================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = c => (c < 0 ? '−$' : '$') + (Math.abs(c) / 100).toFixed(2);
const money0 = c => '$' + Math.round(c / 100).toLocaleString('en-NZ');
const n1 = n => (Math.round(n * 10) / 10).toLocaleString('en-NZ');
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const D = s => new Date(s + 'T12:00:00');
const niceDate = s => s ? D(s).toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short' }) : '—';
const shortDate = s => s ? D(s).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' }) : '—';
const daysUntil = s => Math.round((D(s) - D(state.data?.today || new Date().toISOString().slice(0, 10))) / 864e5);
const ago = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 24) return h + ' h ago';
  const d = Math.round(h / 24); return d < 7 ? d + ' d ago' : new Date(iso).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' });
};
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const TITLES = { today: 'Today', orders: 'Orders', stock: 'Stock', batches: 'Batches', safety: 'Safety', numbers: 'Numbers' };
const ICON = {
  temp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4.5a2 2 0 0 1 4 0v9.3a4 4 0 1 1-4 0z"/><path d="M12 10v6"/></svg>',
  clean: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M7 20l1.5-7h7L17 20"/><path d="M10 13V5a2 2 0 0 1 4 0v8"/></svg>',
  gauge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.5 17a8 8 0 1 1 15 0"/><path d="m12 13 3.5-4"/><circle cx="12" cy="13.5" r="1.3"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 21 19.5H3z"/><path d="M12 10v4.5M12 17.2v.1"/></svg>'
};
const STATUS = { marinating: 'Marinating', drying: 'Drying', ready: 'Ready to pack', packed: 'Packed', closed: 'Closed' };
const STEP = { marinating: 0, drying: 1, ready: 2, packed: 3, closed: 3 };
const AUTO_USE = { '': 'Not automatic', 'raw-kg': 'Per kg of raw meat', 'bag-50': 'Each 50 g bag', 'bag-100': 'Each 100 g bag', 'bag-200': 'Each 200 g bag', 'bag-100+': 'Each 100 g and 200 g bag', 'bag-any': 'Every bag' };

let key = '';
try { key = localStorage.getItem('bb-dispatch') || ''; } catch {}
const state = { tab: 'today', data: null, noDb: false, orders: null, ordersErr: '', stockSeg: 'bags', period: 'd30', loading: false };
try { const t = sessionStorage.getItem('bb-tab'); if (TITLES[t]) state.tab = t; } catch {}

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-dispatch-key': key, ...(opts.headers || {}) } });
  let data = {}; try { data = await res.json(); } catch {}
  return { status: res.status, ok: res.ok, data };
}
const post = body => api('/api/boss', { method: 'POST', body: JSON.stringify(body) });

/* ------------------------------------------------------------------ loading */
async function loadBoss() {
  const r = await api('/api/boss');
  if (r.status === 401) { logout('Wrong password.'); return false; }
  if (r.status === 503 && r.data.error === 'no_db') { state.noDb = true; state.data = null; return true; }
  if (!r.ok) { toast(r.data.error || 'Couldn’t load the dashboard.', true); return true; }
  state.noDb = false; state.data = r.data; return true;
}
async function loadOrders() {
  const r = await api('/api/orders');
  if (r.status === 401) { logout('Wrong password.'); return; }
  if (!r.ok) { state.ordersErr = r.data.error || 'Couldn’t load orders.'; state.orders = state.orders || []; }
  else { state.ordersErr = ''; state.orders = r.data.orders; }
  const n = state.orders.filter(o => !o.shippedAt).length;
  $('#shipBadge').textContent = n; $('#shipBadge').classList.toggle('hide', !n);
  render();
}
async function loadAll(first) {
  if (state.loading) return; state.loading = true;
  $('#refresh').classList.add('spin');
  const okBoss = await loadBoss();
  if (okBoss === false) { state.loading = false; $('#refresh').classList.remove('spin'); return; }
  showApp(); render();
  if (state.data) loadSafety();
  await loadOrders();
  $('#refresh').classList.remove('spin'); state.loading = false;
  // Catch any paid orders the webhook missed, then refresh if it found some.
  if (first && state.data) {
    const s = await post({ action: 'sync-orders' });
    if (s.ok && s.data.added) toast(`Picked up ${plural(s.data.added, 'order')} from Stripe`);
    if (s.ok && (s.data.added || s.data.money?.added || s.data.money?.updated)) await refreshBoss();
  }
}
async function refreshBoss() { await loadBoss(); render(); }

function showApp() {
  $('#login').classList.add('hide'); $('#view').classList.remove('hide'); $('#tabs').classList.remove('hide');
  $('#refresh').classList.remove('hide'); $('#settingsBtn').classList.toggle('hide', !state.data);
}

/* ------------------------------------------------------------------ render */
function setTab(t) {
  state.tab = t; try { sessionStorage.setItem('bb-tab', t); } catch {}
  window.scrollTo(0, 0); render();
}
function render() {
  $('#title').textContent = TITLES[state.tab];
  $$('nav.tabs button').forEach(b => b.dataset.tab === state.tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  const v = $('#view');
  if (state.tab === 'orders') { v.innerHTML = viewOrders(); return; }
  if (state.noDb) { v.innerHTML = setupCard(); return; }
  if (!state.data) { v.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; return; }
  v.innerHTML = { today: viewToday, stock: viewStock, batches: viewBatches, safety: viewSafety, numbers: viewNumbers }[state.tab]();
  const fsN = (state.data.safety?.due.length || 0) + (state.data.safety?.openCorrective.length || 0);
  $('#fsBadge').textContent = fsN; $('#fsBadge').classList.toggle('hide', !fsN);
}

function setupCard() {
  return `<div class="card"><h2 style="font:600 18px/1.2 Oswald,sans-serif;letter-spacing:.05em;text-transform:uppercase;margin:0 0 8px">Connect the database</h2>
    <p class="muted" style="margin:0 0 12px">Stock, batches and numbers need a small database. In Vercel, open your project, go to <b>Storage</b>, add a <b>Neon</b> Postgres database and connect it to this project. Then push again or redeploy.</p>
    <p class="muted small" style="margin:0">Orders and dispatch work in the meantime.</p>
    <button class="btn sec2 full mt" data-tab-go="orders">Go to orders</button></div>`;
}

/* ================================================================== TODAY */
function viewToday() {
  const d = state.data, n = d.numbers;
  const toShip = state.orders ? state.orders.filter(o => !o.shippedAt).length : null;
  const bags = d.products.reduce((a, p) => a + Math.max(0, p.onHand), 0);
  const inProg = d.batches.filter(b => ['marinating', 'drying', 'ready'].includes(b.status));
  const fc = n.forecast;
  let h = `<div class="hello">${D(d.today).toLocaleDateString('en-NZ', { weekday: 'long', day: 'numeric', month: 'long' })}</div>${dueCard()}
  <div class="grid2">
    <button class="stat" data-tab-go="orders"><span class="k">To ship</span><span class="v">${toShip == null ? '…' : toShip}</span><span class="s">${toShip ? 'Posted orders waiting' : 'All caught up'}</span></button>
    <button class="stat" data-tab-go="numbers"><span class="k">Last 7 days</span><span class="v">${money0(n.d7.cents)}</span><span class="s">${plural(n.d7.units, 'bag')} sold</span></button>
    <button class="stat" data-tab-go="stock"><span class="k">Bags on hand</span><span class="v">${bags}</span><span class="s">${d.settings.live ? 'Live on the shop' : 'Not live on shop yet'}</span></button>
    <button class="stat" data-tab-go="numbers"><span class="k">Next batch</span><span class="v ${fc?.overdue ? 'warn-t' : ''}" style="${fc ? 'font-size:21px;padding-top:4px' : ''}">${fc ? (fc.overdue ? 'Start now' : niceDate(fc.startBy)) : '—'}</span><span class="s">${fc ? `Stock lasts ~${fc.daysLeft} days` : 'Needs a few weeks of sales'}</span></button>
  </div>`;

  const shown = d.alerts.filter(a => !a.snoozedUntil), noted = d.alerts.filter(a => a.snoozedUntil);
  if (shown.length || noted.length) {
    h += `<div class="sec"><h2>Needs attention</h2>${noted.length ? `<button class="link" data-do="show-noted">${state.showNoted ? 'Hide' : 'Show'} ${noted.length} noted</button>` : ''}</div>`;
    const list = shown.slice(0, 10).concat(state.showNoted ? noted : []);
    h += list.length ? `<div class="card flush list">${list.map(alertRow).join('')}</div>` : '<div class="card empty">All clear.</div>';
  }

  if (inProg.length) {
    h += `<div class="sec"><h2>In progress</h2></div>` + inProg.map(batchCard).join('');
  }

  h += `<div class="sec"><h2>Recent activity</h2></div>` + activityList(d.recent.slice(0, 10));
  return h;
}

function activityList(rows) {
  if (!rows.length) return `<div class="card empty">Nothing recorded yet. Pack a batch or do a stocktake to get started.</div>`;
  return `<div class="card flush list">${rows.map(m => {
    const canUndo = !['online', 'packed'].includes(m.reason);
    const who = m.customer ? esc(m.customer.split(' · ')[0]) : '';
    return `<div class="it"><span class="main"><span class="t">${m.qty > 0 ? '+' : '−'}${Math.abs(m.qty)} ${esc(m.label)}</span>
      <span class="d">${esc(m.reasonLabel)}${m.code ? ' · ' + esc(m.code) : ''}${who ? ' · ' + who : ''}${m.note ? ' · ' + esc(m.note) : ''}</span></span>
      <span class="end"><span class="tiny faint">${ago(m.at)}</span>${canUndo ? `<br><button class="btn quiet sm" style="min-height:26px;padding:0;font-size:12.5px" data-do="undo" data-id="${m.id}">Undo</button>` : ''}</span></div>`;
  }).join('')}</div>`;
}


/* ---------- needs-attention rows: tap to go there, or deal with it in place ---------- */
function alertRow(a) {
  const go = `data-tab-go="${a.tab === 'supplies' ? 'stock' : a.tab}" ${a.tab === 'supplies' ? 'data-seg="supplies"' : ''}`;
  let actions = '';
  if (a.snoozedUntil) actions = `<button class="btn quiet sm al-btn" data-do="alert-unsnooze" data-key="${esc(a.key)}">Show</button>`;
  else if (a.kind === 'reorder') actions = `<button class="btn sec2 sm al-btn" data-do="supply-ordered" data-id="${a.supplyId}">Ordered</button>`;
  else if (a.kind === 'onorder') actions = `<button class="btn sm al-btn" data-do="supply-arrived" data-id="${a.supplyId}">Arrived</button>`;
  else if (!a.fixed) actions = `<button class="btn quiet sm al-btn" data-do="alert-snooze" data-key="${esc(a.key)}">Noted</button>`;
  const sub = a.snoozedUntil ? `<span class="d">Noted · back ${new Date(a.snoozedUntil).toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short' })} if still true</span>` : '';
  return `<div class="it al ${a.snoozedUntil ? 'al-noted' : ''}"><span class="dot ${a.level}"></span>
    <button class="main al-go" ${go}><span class="d" style="color:var(--ink);font-size:14px">${esc(a.text)}</span>${sub}</button>${actions}</div>`;
}

/* ================================================================== ORDERS */
function viewOrders() {
  if (!state.orders) return '<div class="skel"></div><div class="skel"></div>';
  const todo = state.orders.filter(o => !o.shippedAt), done = state.orders.filter(o => o.shippedAt);
  return `${state.ordersErr ? `<div class="note" style="margin-bottom:12px">${esc(state.ordersErr)}</div>` : ''}
  <div class="sec" style="margin-top:4px"><h2>To ship</h2><span class="small muted">${todo.length ? plural(todo.length, 'order') : ''}</span></div>
  ${todo.length ? todo.map(orderCard).join('') : '<div class="card empty">Nothing waiting to ship.</div>'}
  <details class="more"><summary>Already shipped (${done.length})</summary>${done.length ? done.map(orderCard).join('') : '<div class="card empty">None yet.</div>'}</details>
  <details class="more"><summary>Email tools</summary><div class="card">
    <div class="muted small">Check the shipped email looks right without needing a real order.</div>
    <button class="btn sec2 mt" data-do="sample">Email me a sample</button><div class="msg" id="sampleMsg"></div></div></details>`;
}
function orderCard(o) {
  const shipped = !!o.shippedAt;
  const when = new Date(o.created * 1000).toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short' });
  const batches = (o.batches || []).map(b => `<span class="chip plain">${esc(b)}</span>`).join(' ');
  return `<div class="card order ${shipped ? 'shipped' : ''}" data-id="${esc(o.id)}">
    <div class="top"><span class="ref">#${esc(o.ref)}</span><span class="small muted">${when} · ${money(o.total)}</span></div>
    <div class="name">${esc(o.name || o.email)}</div>
    <ul>${o.items.map(i => `<li>${i.qty} × ${esc(i.desc)}</li>`).join('')}</ul>

           <input class="in post-in" inputmode="decimal" placeholder="${o.postage != null ? (o.postage / 100).toFixed(2) : '6.50'}" style="max-width:100px;min-height:38px;padding:6px 10px;margin-left:auto">
           <button class="btn sec2 sm" data-postage>${o.postage != null ? 'Change' : 'Save'}</button></div>` : ''}`

async function shipAction(btn) {
  const el = btn.closest('.order'), msg = $('.msg', el);
  const tracking = $('.trk', el).value.trim(), note = $('.note-in', el).value.trim(), act = btn.dataset.ship;
  if (act !== 'mark' && !tracking) { msg.className = 'msg bad'; msg.textContent = 'Add the tracking number first.'; return; }
  if ((act === 'send' || act === 'mark') && !arm(btn, act === 'send' ? 'Tap again to send' : 'Tap again to mark shipped (no email)', act === 'send' ? 'btn dark' : null)) return;
  $$('button', el).forEach(b => b.disabled = true);
  msg.className = 'msg'; msg.textContent = 'Sending…';
  const postage = $('.post-in', el)?.value.trim() || '';
  const r = await api('/api/mark-shipped', { method: 'POST', body: JSON.stringify({ sessionId: el.dataset.id, tracking, note, postage: act === 'test' ? '' : postage, test: act === 'test', markOnly: act === 'mark' }) });
  $$('button', el).forEach(b => b.disabled = false);
  if (r.ok) {
    msg.className = 'msg ok';
    msg.textContent = act === 'test' ? `Test sent to ${r.data.sentTo}.` : act === 'mark' ? 'Marked as shipped. No email sent.' : `Sent to ${r.data.sentTo}. Marked as shipped.`;
    if (act !== 'test') setTimeout(loadOrders, 1400);
  } else {
    msg.className = 'msg bad';
    msg.textContent = r.data.error === 'already_shipped' ? 'This order was already marked shipped.' : (r.data.error || 'Something went wrong.');
  }
}

/* Two taps for anything that can't be taken back: the first tap arms it. */
function arm(btn, text, cls) {
  if (btn.dataset.armed) { delete btn.dataset.armed; return true; }
  const was = { cls: btn.className, txt: btn.innerHTML };
  btn.dataset.armed = '1'; btn.textContent = text; if (cls) btn.className = cls + (was.cls.includes('full') ? ' full' : '');
  setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.className = was.cls; btn.innerHTML = was.txt; } }, 4500);
  return false;
}

/* ================================================================== STOCK */
function stateOf(p, live) {
  if (p.hidden) return 'off';
  if (p.onHand <= 0) return 'out';
  if (p.onHand <= p.lowAt) return 'low';
  return '';
}
function viewStock() {
  const d = state.data;
  let h = `<div class="seg" role="group"><button data-seg="bags" aria-pressed="${state.stockSeg === 'bags'}">Bags</button><button data-seg="supplies" aria-pressed="${state.stockSeg === 'supplies'}">Supplies</button></div>`;

  if (!d.settings.live) h += `<div class="note" style="margin-bottom:12px">The shop is still using the sold-out switches in the code. Once you’ve counted your bags, turn on <b>live stock</b> in Settings and the shop will follow these numbers.</div>`;
  h += `<div class="btns" style="margin-bottom:14px"><button class="btn" data-do="adjust">Record in / out</button><button class="btn sec2" data-do="stocktake">Stocktake</button></div>`;
  for (const f of d.flavours) {

      <span class="row">${d.waitlist[f.id] ? `<span class="chip gold">${d.waitlist[f.id]} waiting</span>` : ''}<span class="chip ${allOut ? 'bad' : 'ok'}">${allOut ? 'Sold out' : plural(total, 'bag')}</span></span></div>
      <div class="grid3">${ps.map(p => {
        const pace = d.numbers.pace[p.sku];
        const sub = p.hidden ? 'Hidden' : pace?.daysLeft != null && p.onHand > 0 ? (pace.daysLeft < 2 ? 'Last few' : `~${pace.daysLeft} days`) : (d.sizes.find(z => z.grams === p.grams)?.label || '');
        return `<button class="tile ${stateOf(p)}" data-do="sku" data-sku="${p.sku}"><div class="g">${p.grams}G</div><div class="n">${p.onHand}</div><div class="l">${esc(sub)}</div></button>`;
      }).join('')}</div></div>`;
  }
  h += `<div class="card"><div class="between"><span class="muted small">Stock value at shop prices</span><b>${money0(d.numbers.stockValue)}</b></div>
    <div class="between mt"><span class="muted small">Last stocktake</span><b>${d.settings.lastStocktake ? niceDate(d.settings.lastStocktake) : 'Not yet'}</b></div></div>`;

function viewSupplies() {
  const d = state.data;
  let h = `<button class="btn sec2 full" data-do="supply-new" style="margin-bottom:14px">${PLUS} Add a supply</button>`;
  for (const [cat, label] of [['packaging', 'Packaging'], ['ingredient', 'Ingredients'], ['other', 'Other']]) {

    h += `<div class="sec"><h2>${label}</h2></div><div class="card flush list">${rows.map(s => {
      const counted = s.on_hand > 0 || s.cost_cents != null || s.reorder_at != null;
      let chip = '', cls = 'ok', pct = 100;
      const onOrd = state.data.settings.onOrder?.[s.id];
      if (onOrd) chip = '<span class="chip gold">On order</span>';
      if (s.on_hand < 0) { chip = '<span class="chip plain">Count needed</span>'; cls = 'bad'; pct = 0; }
      else if (s.reorder_at != null) {

        ${s.reorder_at != null ? `<div class="bar ${cls}" style="margin-top:7px;max-width:220px"><i style="width:${pct}%"></i></div>` : ''}</span>

const fmtQty = n => Number.isInteger(n) ? n.toLocaleString('en-NZ') : n1(n);

/* ================================================================== BATCHES */
function batchCard(b) {
  const fl = state.data.flavours.find(f => f.id === b.flavour)?.label || b.flavour;
  const open = ['marinating', 'drying', 'ready'].includes(b.status);
  const step = STEP[b.status];
  let body = '';
  if (open) {
    const next = { marinating: ['Hung to dry', 'drying'], drying: ['Ready to pack', 'ready'], ready: ['Pack bags', 'pack'] }[b.status];
    const since = b.status === 'drying' && b.drying_on ? ` · day ${daysUntil(b.drying_on) * -1 + 1} of drying` : '';
    body = `<div class="steps">${[0, 1, 2, 3].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>
      <div class="steps-l">${['Marinate', 'Dry', 'Ready', 'Packed'].map((l, i) => `<span class="${i === step ? 'on' : ''}">${l}</span>`).join('')}</div>
      <div class="small muted mt">${n1(b.raw_kg)} kg raw${b.cut ? ' ' + esc(b.cut.toLowerCase()) : ''} · started ${shortDate(b.started_on)}${since}</div>
      ${batchTimes(b)}
      ${b.status === 'marinating' ? `<button class="btn quiet sm" data-do="recipe" data-id="${b.id}" style="padding:0;min-height:30px;text-decoration:none;color:var(--gold-2);margin-right:14px">Recipe for ${n1(b.raw_kg)} kg ›</button>` : ''}
      ${(() => { const p = state.data.safety?.batches?.[b.id]; return p ? `<button class="btn quiet sm" data-do="fs-batch" data-id="${b.id}" style="padding:0;min-height:30px;text-decoration:none;color:${p.failed.length ? 'var(--bad)' : 'var(--gold-2)'}">Safety record: ${p.failed.length ? 'check failed' : p.done + ' of ' + p.total + ' done'} ›</button>` : ''; })()}
      <div class="btns mt"><button class="btn sec2" data-do="batch" data-id="${b.id}">Details</button>
      <button class="btn" data-do="${next[1] === 'pack' ? 'pack' : 'advance'}" data-id="${b.id}" data-to="${next[1]}">${next[0]}</button></div>`;
  } else {
    const left = b.remainingBags, total = b.packedBags;
    const bbDays = b.best_before ? daysUntil(b.best_before) : null;
    body = `<div class="small muted" style="margin-top:2px">Packed ${shortDate(b.packed_on)}${b.best_before ? ` · best before ${shortDate(b.best_before)}` : ''}${b.yieldPct ? ` · ${b.yieldPct}% yield` : ''}</div>
      <div class="between mt small"><span>${left} of ${total} bags left</span>${bbDays != null && left > 0 && bbDays <= state.data.settings.bestBeforeWarnDays ? `<span class="chip ${bbDays < 0 ? 'bad' : 'warn'}">${bbDays < 0 ? 'Past best-before' : bbDays + ' days to BB'}</span>` : ''}</div>
      <div class="bar" style="margin-top:7px"><i style="width:${total ? left / total * 100 : 0}%"></i></div>`;
  }
  return `<div class="card" ${open ? '' : `data-do="batch" data-id="${b.id}" role="button" tabindex="0" style="cursor:pointer"`}>
    <div class="between"><span class="code">${esc(b.code)}</span><span class="chip ${open ? 'gold' : b.status === 'closed' ? 'plain' : 'ok'}">${STATUS[b.status]}</span></div>
    <div class="btitle">${esc(fl)}</div>${body}</div>`;
}
function viewBatches() {
  const d = state.data;
  const open = d.batches.filter(b => ['marinating', 'drying', 'ready'].includes(b.status));
  const packed = d.batches.filter(b => b.status === 'packed');
  const closed = d.batches.filter(b => b.status === 'closed');
  let h = `<div class="btns" style="margin-bottom:6px"><button class="btn" data-do="start-batch">${PLUS} Start a batch</button><button class="btn sec2" data-do="recipe">Recipe</button></div>`;
  h += `<div class="sec"><h2>In progress</h2></div>` + (open.length ? open.map(batchCard).join('') : '<div class="card empty">No batch on the go.</div>');
  h += `<div class="sec"><h2>In stock</h2></div>` + (packed.length ? packed.map(batchCard).join('') : '<div class="card empty">Packed batches show here, with how many bags are left from each.</div>');
  if (closed.length) h += `<details class="more"><summary>Finished batches (${closed.length})</summary>${closed.map(batchCard).join('')}</details>`;
  return h;
}


/* ---------- batch timing: when it went in, when to be back ---------- */
function clockWhen(iso) {
  const d = new Date(iso), now = new Date();
  const t = d.toLocaleTimeString('en-NZ', { hour: 'numeric', minute: '2-digit' }).replace(' ', '').toLowerCase();
  const day = new Date(d.toDateString()), today = new Date(now.toDateString());
  const diff = Math.round((day - today) / 864e5);
  return diff === 0 ? `${t} today` : diff === 1 ? `${t} tomorrow` : diff === -1 ? `${t} yesterday` : `${d.toLocaleDateString('en-NZ', { weekday: 'short' })} ${t}`;
}
function untilText(iso) {
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return 'Ready now';
  const mins = Math.ceil(ms / 6e4), h = Math.floor(mins / 60), m = mins % 60;
  return `in ${h ? h + ' h' : ''}${h && m ? ' ' : ''}${m || !h ? m + ' min' : ''}`;
}
function sinceText(iso) {
  const h = (Date.now() - new Date(iso)) / 36e5;
  return h < 1 ? `${Math.round(h * 60)} min so far` : `${Math.floor(h)} h so far · day ${Math.floor(h / 24) + 1}`;
}
function batchTimes(b) {
  const t = state.data.safety?.batches?.[b.id]?.times || {};
  const minH = state.safety?.settings?.limits?.marinateMinH ?? 10;
  const mStart = t.marinate_start || b.marinate_at, dStart = t.drying_start || b.drying_at;
  const row = (label, value, chip) => `<div class="between" style="padding:5px 0"><span class="muted small">${label}</span><span class="row" style="gap:8px"><b class="small">${value}</b>${chip || ''}</span></div>`;
  if (b.status === 'marinating') {
    if (!mStart) return `<div class="timebox"><button class="btn quiet sm" data-do="batch" data-id="${b.id}" style="padding:0;min-height:26px">Add the time it went into the marinade ›</button></div>`;
    const ready = new Date(new Date(mStart).getTime() + minH * 36e5).toISOString();
    return `<div class="timebox">${row('Into the marinade', clockWhen(mStart))}
      ${row(`Out from (${minH} h)`, clockWhen(ready), `<span class="chip ${new Date(ready) <= new Date() ? 'ok' : 'gold'}" data-until="${ready}">${untilText(ready)}</span>`)}</div>`;
  }
  if (b.status === 'drying') {
    if (!dStart) return `<div class="timebox"><button class="btn quiet sm" data-do="batch" data-id="${b.id}" style="padding:0;min-height:26px">Add the time it went on the dryer ›</button></div>`;
    return `<div class="timebox">${row('On the dryer', clockWhen(dStart))}${row('Drying', `<span data-since="${dStart}">${sinceText(dStart)}</span>`)}</div>`;
  }
  if (b.status === 'ready' && t.drying_end) return `<div class="timebox">${row('Off the dryer', clockWhen(t.drying_end))}</div>`;
  return '';
}
// Keep the countdowns current while the app is open.
setInterval(() => {
  $$('[data-until]').forEach(el => { el.textContent = untilText(el.dataset.until); if (new Date(el.dataset.until) <= new Date()) el.className = 'chip ok'; });
  $$('[data-since]').forEach(el => { el.textContent = sinceText(el.dataset.since); });
}, 30000);

      <table class="t mt2"><tr><th>Bag</th><th>Price</th><th>Cost</th><th>Profit</th></tr>${n.margins.map(m =>
        `<tr><td>${m.grams} g</td><td>${money(m.price)}</td><td>${money(m.cost)}</td><td><b>${money(m.profit)}</b> <span class="muted small">${m.pct}%</span></td></tr>`).join('')}</table>
      <p class="hint">Meat, ingredients and packaging from your recent batches. Add prices to supplies to make it more accurate.</p>`;
  } else {
    h += `<p class="muted small" style="margin:0">Enter what you paid for the meat when you start a batch, and costs on your supplies. Once a batch is packed you’ll see cost per bag and profit here.${n.avgYield ? `<br><br>Average yield so far: <b>${n.avgYield} g per raw kg</b>.` : ''}</p>`;
  }
  h += `</div>`;

  const hist = d.batches.filter(b => b.packedBags).slice(0, 8);
  if (hist.length) {
    h += `<div class="sec"><h2>Batch history</h2></div><div class="card"><table class="t"><tr><th>Batch</th><th>Raw</th><th>Bags</th><th>Loss</th><th>Yield</th></tr>${hist.map(b =>
      `<tr data-do="batch" data-id="${b.id}" style="cursor:pointer"><td><b>${esc(b.code)}</b></td><td>${n1(b.raw_kg)} kg</td><td>${b.packedBags}</td><td>${b.lossPct != null ? b.lossPct + '%' : '—'}</td><td>${b.yieldPct != null ? b.yieldPct + '%' : '—'}</td></tr>`).join('')}</table>
      <p class="hint">Loss is raw to dried weight. Yield is bagged weight out of raw weight.</p></div>`;
  }
  return h;
}

/* ================================================================== SHEETS */
let sheetOnClose = null;
function openSheet(title, html, onMount, back) {
  $('#shTitle').textContent = title; $('#shBody').innerHTML = html; $('#shBody').scrollTop = 0;
  const bk = $('#shBack'); bk.classList.toggle('hide', !back); bk.onclick = back || null;
  $('#scrim').classList.remove('hide'); $('#sheet').classList.remove('hide');
  requestAnimationFrame(() => { $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); });
  document.body.style.overflow = 'hidden';
  if (onMount) onMount($('#shBody'));
}
function closeSheet() {
  $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on');
  document.body.style.overflow = '';
  setTimeout(() => { $('#scrim').classList.add('hide'); $('#sheet').classList.add('hide'); $('#shBody').innerHTML = ''; }, 260);
}

let toastTimer;
function toast(text, bad, action) {
  const t = $('#toast'); $('#toastText').textContent = text; t.classList.toggle('bad', !!bad);
  const a = $('#toastAct');
  if (action) { a.textContent = action.label; a.onclick = () => { t.classList.remove('on'); action.fn(); }; a.classList.remove('hide'); } else a.classList.add('hide');
  t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), action ? 6000 : 3200);
}

/** Send a change, show the result, refresh the numbers. */
async function act(body, { close = true, btn, errEl } = {}) {
  if (btn) btn.disabled = true;
  const r = await post(body);
  if (btn) btn.disabled = false;
  if (!r.ok) { if (errEl) errEl.textContent = r.data.error || 'Couldn’t save that.'; else toast(r.data.error || 'Couldn’t save that.', true); return null; }
  if (close) closeSheet();
  toast(r.data.msg || 'Saved');
  await refreshBoss();
  if (state.safety && String(body.action).startsWith('fs-')) await loadSafety();
  return r.data;
}

const choiceHtml = (name, opts, sel) => `<div class="choices" data-name="${name}">${opts.map(([v, l]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${String(v) === String(sel)}">${esc(l)}</button>`).join('')}</div>`;
const stepper = (name, val = 0, min = 0) => `<div class="stepper"><button type="button" data-step="-1" aria-label="Less">−</button><input name="${name}" inputmode="numeric" pattern="[0-9]*" value="${val}" data-min="${min}"><button type="button" data-step="1" aria-label="More">+</button></div>`;
const pick = (root, name) => $(`.choices[data-name="${name}"] [aria-pressed="true"]`, root)?.dataset.v ?? '';

function sheetPack(id) {
  const d = state.data, b = d.batches.find(x => x.id === id);
  const months = d.settings.shelfLifeMonths || 3;
  const bbFrom = s => { const x = new Date(s + 'T12:00:00Z'); x.setUTCMonth(x.getUTCMonth() + months); return x.toISOString().slice(0, 10); };
  openSheet(`Pack ${b.code}`, `
    <p class="muted small" style="margin:0">${n1(b.raw_kg)} kg raw · ${esc(d.flavours.find(f => f.id === b.flavour)?.label)}</p>
    ${(() => { const p = d.safety?.batches?.[b.id]; return p && !p.released ? `<div class="note" style="margin-top:10px">Its food safety record isn’t released yet (${p.done} of ${p.total} done). Bags go into stock, but finish the record before selling them. <button type="button" class="btn sm dark" data-do="fs-batch" data-id="${b.id}" style="margin-top:8px">Open record</button></div>` : ''; })()}
    <label class="f">Bags packed</label>
    ${d.sizes.map(z => `<div class="packrow"><div><b>${z.grams} g</b> <span class="muted small">${esc(z.label)}</span></div>${stepper('bag' + z.grams, 0)}</div>`).join('')}
    <div class="note info mt" id="packSum">Enter your bag counts.</div>
    <label class="f">Dried weight before bagging (kg, optional)</label><input class="in" name="driedKg" inputmode="decimal" placeholder="5.2">
    <label class="f">Packed on</label><input class="in" type="date" name="packedOn" value="${d.today}">
    <label class="f">Best before</label><input class="in" type="date" name="bestBefore" value="${bbFrom(d.today)}">
    <p class="hint">Set to ${months} months from packing. Change it in Settings.</p>
    <label class="check"><input type="checkbox" name="useSupplies" checked><span>Take pouches and labels off supplies</span></label>
    <div class="err"></div>
    <button class="btn full mt" id="save">Put bags into stock</button>`, root => {
    const sum = () => {
      const bags = Object.fromEntries(d.sizes.map(z => [z.grams, +$(`[name=bag${z.grams}]`, root).value || 0]));
      const n = Object.values(bags).reduce((a, x) => a + x, 0), g = Object.entries(bags).reduce((a, [k, x]) => a + k * x, 0);
      const dk = parseFloat($('[name=driedKg]', root).value);
      $('#packSum', root).innerHTML = n ? `<b>${plural(n, 'bag')}</b> · ${n1(g / 1000)} kg bagged · yield <b>${Math.round(g / (b.raw_kg * 10))}%</b>${dk ? ` · weight loss ${n1((1 - dk / b.raw_kg) * 100)}%` : ''}` : 'Enter your bag counts.';
      return bags;
    };
    root.addEventListener('input', sum); root.addEventListener('click', () => setTimeout(sum));
    $('[name=packedOn]', root).addEventListener('change', e => { $('[name=bestBefore]', root).value = bbFrom(e.target.value); });
    $('#save', root).onclick = e => act({ action: 'batch-pack', id, bags: sum(), driedKg: $('[name=driedKg]', root).value, packedOn: $('[name=packedOn]', root).value,
      bestBefore: $('[name=bestBefore]', root).value, useSupplies: $('[name=useSupplies]', root).checked }, { btn: e.target, errEl: $('.err', root) });
  });
}

const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

async function loadSafety() {

async function ensureSafety() { if (!state.safety) await loadSafety(); return state.safety; }
const FS = () => state.safety?.settings || { limits: {}, units: ['Chiller'], reminders: [] };
const timeNow = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const toLocalInput = iso => { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const when = iso => new Date(iso).toLocaleString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });

const flavourLabel = id => state.data.flavours.find(f => f.id === id)?.label || id;

function logRow(r) {
  let t = KIND_LABEL[r.kind], d = '';
  if (r.kind === 'chiller') { t = `${r.data.readingC} °C · ${esc(r.data.unit || 'Fridge')}`; d = r.data.action ? 'Action: ' + esc(r.data.action) : ''; }
  if (r.kind === 'cleaning') d = Object.keys(r.data.areas || {}).filter(k => r.data.areas[k]?.cleaned || r.data.areas[k]?.sanitised).map(esc).join(', ');
  if (r.kind === 'calibration') { const e = state.safety.schema.calibration.find(c => c.id === r.data.equipment); t = e ? e.label : 'Calibration'; d = e ? `${esc(e.check)} · ${r.data.reading} vs ${r.data.reference} ${e.unit}` : ''; }
  if (r.kind === 'corrective') { t = esc(String(r.data.what || '').slice(0, 70)); d = r.code ? 'Batch ' + esc(r.code) : ''; }
  if (r.kind === 'skip') { t = esc(r.data.title); d = 'Reason: ' + esc(r.data.reason); }
  return `<button class="it" data-do="fs-record" data-id="${r.id}"><span class="main"><span class="t">${t}</span><span class="d">${d ? d + ' · ' : ''}${when(r.at)} · ${esc(r.initials || '')}${r.replaces ? ' · corrected' : ''}</span></span>
    <span class="end">${resultChip(r)}</span></button>`;
}

function spark(pts, limit) {
  const W = 320, H = 86, pad = 8;
  const vals = pts.map(p => p.c);
  const lo = Math.min(0, ...vals) - 0.5, hi = Math.max(limit + 1.5, ...vals) + 0.5;
  const x = i => pad + i * (W - 2 * pad) / Math.max(1, pts.length - 1);
  const y = v => H - pad - (v - lo) / (hi - lo) * (H - 2 * pad);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.c).toFixed(1)}`).join('');
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" class="spark" role="img" aria-label="Recent fridge temperatures">
    <rect x="0" y="0" width="${W}" height="${y(limit).toFixed(1)}" fill="rgba(154,51,36,.06)"/>
    <line x1="0" x2="${W}" y1="${y(limit).toFixed(1)}" y2="${y(limit).toFixed(1)}" stroke="#9a3324" stroke-dasharray="4 4" stroke-width="1"/>
    <text x="${W - 4}" y="${(y(limit) - 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9a3324">${limit} °C limit</text>
    <path d="${path}" fill="none" stroke="#b9873c" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.c).toFixed(1)}" r="${i === pts.length - 1 ? 4 : 2.6}" fill="${p.c > limit ? '#9a3324' : '#3d6a37'}"/>`).join('')}
  </svg><div class="between small muted"><span>Latest ${last.c} °C · ${ago(last.at)}</span><span>${vals.filter(v => v > limit).length ? `<b class="bad-t">${vals.filter(v => v > limit).length} over</b>` : 'All within limit'}</span></div>`;
}

/* ---------- generic form, driven by the schema from the server ---------- */
function limitFor(f) {
  if (!f.limit) return null;
  const L = FS().limits; const k = f.limit.max ?? f.limit.min; const v = L[k];
  return v == null ? null : { max: f.limit.max ? v : null, min: f.limit.min ? v : null, strict: !!f.limit.strict };
}
function optionsFor(f) {
  if (f.options === 'units') return FS().units.map(u => [u, u]);
  if (f.options === 'calibration') return state.safety.schema.calibration.map(c => [c.id, `${c.label}: ${c.check}`]);
  return f.options.map(o => [o, o]);
}
function fieldHtml(f, v) {
  const id = 'f-' + f.k;
  switch (f.type) {

    case 'area': return `<div class="${f.failOnly ? 'fail-only hide' : ''}" data-wrap="${f.k}"><label class="f" for="${id}">${esc(f.label)}</label><textarea class="in" id="${id}" data-k="${f.k}" placeholder="${esc(f.placeholder || '')}">${esc(v ?? '')}</textarea></div>`;

    case 'info': return `<div class="info-row"><span class="muted">${esc(f.label)}</span><b data-info="${f.k}">—</b></div>`;

        <div class="numrow" data-numwrap="${f.k}"><input class="in" id="${id}" data-k="${f.k}" inputmode="${f.dec ? 'decimal' : 'numeric'}" value="${esc(v ?? '')}">${f.unit ? `<span class="u">${esc(f.unit)}</span>` : ''}<span class="live" data-live="${f.k}"></span></div>`;

        ${f.options.map(o => `<div class="cl-row" data-area="${esc(o)}"><span class="cl-l">${esc(o)}</span>
          <button type="button" class="mini ${val[o]?.cleaned ? 'on' : ''}" data-col="cleaned" aria-label="Cleaned">${TICK}</button>

    }

        <div class="slices" data-k="${f.k}" data-slices><div class="sl-h"><span>#</span><span>Thick mm</span><span>Raw g</span><span>Dry g</span><span>Loss</span></div>
        ${rows.map((r, i) => sliceRow(r, i)).join('')}</div>

}
const sliceRow = (r, i) => `<div class="sl-r"><span class="n">${i + 1}</span><input inputmode="decimal" data-s="thick" value="${esc(r.thick ?? '')}"><input inputmode="decimal" data-s="raw" value="${esc(r.raw ?? '')}"><input inputmode="decimal" data-s="dry" value="${esc(r.dry ?? '')}"><span class="loss">—</span></div>`;

function readForm(root, fields) {
  const data = {};
  for (const f of fields) {
    if (f.type === 'info') continue;
    if (f.type === 'tick') data[f.k] = $(`[data-tick][data-k="${f.k}"]`, root)?.classList.contains('on') || false;
    else if (f.type === 'choice') data[f.k] = $(`[data-choice][data-k="${f.k}"] [aria-pressed="true"]`, root)?.dataset.v ?? '';
    else if (f.type === 'checklist') {
      const out = {};
      $$('.cl-row', root).forEach(r => { const c = $('[data-col=cleaned]', r).classList.contains('on'), s = $('[data-col=sanitised]', r).classList.contains('on'); if (c || s) out[r.dataset.area] = { cleaned: c, sanitised: s }; });
      data[f.k] = out;
    } else if (f.type === 'slices') {
      data[f.k] = $$('.sl-r', root).map(r => ({ thick: $('[data-s=thick]', r).value.trim(), raw: $('[data-s=raw]', r).value.trim(), dry: $('[data-s=dry]', r).value.trim() }))
        .filter(r => r.thick || r.raw || r.dry).map(r => Object.fromEntries(Object.entries(r).map(([k, v]) => [k, v === '' ? null : Number(v)])));
    } else {
      const el = $(`[data-k="${f.k}"]`, root); if (!el) continue;
      const v = el.value.trim();
      data[f.k] = f.type === 'num' ? (v === '' ? null : Number(v.replace(',', '.'))) : v;
    }
  }
  return data;
}

/** Live colours and worked-out values while filling in. Server re-checks on save. */
function liveCheck(root, fields, ctx = {}) {
  const data = readForm(root, fields);
  let anyFail = false;
  for (const f of fields.filter(f => f.type === 'num' && f.limit)) {
    const L = limitFor(f), v = data[f.k], out = $(`[data-live="${f.k}"]`, root), wrap = $(`[data-numwrap="${f.k}"]`, root);
    if (!out || !L) continue;
    let st = '';
    if (v != null && !Number.isNaN(v)) st = (L.max != null && (L.strict ? v >= L.max : v > L.max)) || (L.min != null && v < L.min) ? 'bad' : 'ok';
    if (st === 'bad') anyFail = true;
    out.className = 'live ' + st; out.textContent = st === 'ok' ? 'Within limit' : st === 'bad' ? 'Over the limit' : '';
    wrap?.classList.toggle('bad', st === 'bad'); wrap?.classList.toggle('ok', st === 'ok');
  }
  // Calibration: tolerance check.
  if (ctx.kind === 'calibration') {
    const e = state.safety.schema.calibration.find(c => c.id === data.equipment);
    const box = $('#calInfo', root);
    if (e && box) {
      const tol = e.tol.pct ? Math.abs(data.reference || 0) * e.tol.pct / 100 : e.tol.abs;
      const has = data.reading != null && data.reference != null;
      const bad = has && Math.abs(data.reading - data.reference) > tol + 1e-9;
      anyFail = anyFail || bad;
      box.innerHTML = `${esc(e.freq)} · tolerance ± ${Math.round(tol * 10) / 10} ${esc(e.unit)}${has ? ` · <b class="${bad ? 'bad-t' : 'ok-t'}">${bad ? 'Out of tolerance' : 'In tolerance'}</b>` : ''}`;
    }
  }
  const S = ctx.sections || {};
  const kg = Number(S.slicing?.data?.trimmedKg) || ctx.rawKg || null;
  const R = recipeNow();
  const at = $('[data-at]', root)?.value;
  const set = (k, t) => { const el = $(`[data-info="${k}"]`, root); if (el) el.innerHTML = t; };
  if (ctx.section === 'marinate_start') {
    if (kg) set('targets', recipeShort(kg, ctx.flavour));
    const out = $('[data-live="saltG"]', root);
    if (kg && data.saltG != null && out) {
      const pk = Math.round(data.saltG / kg * 10) / 10, bad = pk < FS().limits.saltMinPerKg;
      anyFail = anyFail || bad;
      out.className = 'live ' + (bad ? 'bad' : 'ok'); out.textContent = `${pk} g/kg${bad ? ' · below ' + FS().limits.saltMinPerKg : ''}`;
    }
  }
  const hrs = (fromKey) => S[fromKey]?.at && at ? Math.round((new Date(at) - new Date(S[fromKey].at)) / 36e5 * 10) / 10 : null;
  if (ctx.section === 'marinate_end') { const h = hrs('marinate_start'); if (h != null) { const bad = h < FS().limits.marinateMinH; anyFail = anyFail || bad; set('hours', `<span class="${bad ? 'bad-t' : 'ok-t'}">${h} hours</span>`); } else set('hours', 'Save the start first'); }
  if (ctx.section === 'drying_end') { const h = hrs('drying_start'); set('hours', h != null ? `${h} hours` : '—'); }
  if (ctx.section === 'spice' && data.tubBefore != null && data.tubAfter != null) {
    const net = data.tubBefore - data.tubAfter - (data.fallOff || 0), skg = data.seasonedKg || kg;
    set('perKg', skg ? `${Math.round(net)} g · ${Math.round(net / skg * 10) / 10} g/kg <span class="muted">(target ${R.spiceOnMeat ?? Math.round(((R.coriander || 0) + (R.pepper || 0) + (ctx.flavour === 'dryheat' ? R.chilli || 0 : 0)) * 10) / 10} g/kg on the meat)</span>` : `${Math.round(net)} g`);
  }
  if (ctx.section === 'post' && kg && data.finalKg) set('yield', `${Math.round(data.finalKg / kg * 1000) / 10}%`);
  if (ctx.section === 'slices') {
    const thr = FS().limits.releaseLossPct;
    $$('.sl-r', root).forEach(r => {
      const raw = parseFloat($('[data-s=raw]', r).value), dry = parseFloat($('[data-s=dry]', r).value), o = $('.loss', r);
      if (raw > 0 && !Number.isNaN(dry)) { const l = Math.round((raw - dry) / raw * 1000) / 10; const bad = thr != null && l < thr; anyFail = anyFail || bad; o.textContent = l + '%'; o.className = 'loss ' + (thr == null ? '' : bad ? 'bad' : 'ok'); }
      else { o.textContent = '—'; o.className = 'loss'; }
    });
  }
  $$('.fail-only', root).forEach(el => el.classList.toggle('hide', !anyFail && !$('textarea', el).value));
  return anyFail;
}

/**
 * Open a record form. opts: { kind, section, batchId, existing, prefill, back }
 */
async function sheetFsForm(opts) {
  const sv = await ensureSafety(); if (!sv) { toast('Couldn’t load the records', true); return; }
  const { kind, section, batchId, existing } = opts;
  let fields, title, note = '', ctx = { kind, section };
  if (kind === 'batch') {
    const sec = sv.schema.batch.find(s => s.key === section);
    fields = sec.fields; title = `${sec.no}. ${sec.title}`;
    note = [sec.ccp ? `<span class="chip bad">${esc(sec.ccp)}</span>` : '', sec.note ? `<span class="small muted">${esc(sec.note)}</span>` : ''].filter(Boolean).join(' ');
    ctx.sections = opts.sections || {}; const bb = state.data.batches.find(b => b.id === batchId); ctx.rawKg = bb?.raw_kg; ctx.flavour = bb?.flavour;
    if (section === 'marinate_start' || section === 'spice') {
      const kgR = Number(ctx.sections.slicing?.data?.trimmedKg) || ctx.rawKg;
      note += ` <button type="button" class="btn quiet sm" data-do="recipe" data-id="${batchId}" data-kg="${kgR}" style="padding:0;min-height:28px">Full recipe for ${n1(kgR)} kg ›</button>`;
    }
  } else { fields = sv.schema.logs[kind].fields; title = sv.schema.logs[kind].title; }
  const remember = sv.remember[section || kind] || {};
  const base = existing ? existing.data : { ...Object.fromEntries(fields.filter(f => f.remember && remember[f.k]).map(f => [f.k, remember[f.k]])), ...(opts.prefill || {}) };
  if (kind === 'chiller' && !base.unit) base.unit = FS().units[0];
  const needInitials = !FS().initials;
  const bcode = batchId ? state.data.batches.find(b => b.id === batchId)?.code : null;

  openSheet(title, `
    ${bcode ? `<div class="between" style="margin-bottom:4px"><span class="code">${esc(bcode)}</span>${note}</div>` : note ? `<div style="margin-bottom:4px">${note}</div>` : ''}
    ${existing ? `<div class="note info" style="margin:6px 0 4px">You’re correcting a saved record. The original is kept, with your reason.</div>` : ''}
    ${needInitials ? `<label class="f">Your initials</label><input class="in" data-initials maxlength="8" placeholder="MB" style="text-transform:uppercase"><p class="hint">Signs every record, like on paper. Saved for next time.</p>` : ''}
    ${kind === 'calibration' ? '' : ''}
    ${fields.map(f => fieldHtml(f, base[f.k])).join('')}
    ${kind === 'calibration' ? `<div class="hint" id="calInfo"></div>` : ''}
    ${kind === 'corrective' ? `<label class="f">Batch (if a batch is affected)</label><select class="in" data-batch><option value="">No batch</option>${state.data.batches.map(b => `<option value="${b.id}" ${String(b.id) === String(batchId || existing?.batch_id || '') ? 'selected' : ''}>${esc(b.code)} · ${esc(flavourLabel(b.flavour))}</option>`).join('')}</select>` : ''}
    <label class="f">When</label><input class="in" type="datetime-local" data-at value="${existing ? toLocalInput(existing.at) : timeNow()}">
    ${existing ? `<label class="f">What changed and why</label><input class="in" data-reason placeholder="Typed 35 instead of 3.5">` : ''}
    <div class="err"></div>
    <div class="sh-f"><button class="btn full" data-save>${existing ? 'Save correction' : 'Save'}${FS().initials ? ` · ${esc(FS().initials)}` : ''}</button></div>`, root => {
    const update = () => liveCheck(root, fields, ctx);
    // Calibration: fill in the reference for the chosen check.
    if (kind === 'calibration') root.addEventListener('click', e => {
      const b = e.target.closest('[data-choice][data-k="equipment"] button'); if (!b) return;
      setTimeout(() => { const eq = sv.schema.calibration.find(c => c.id === b.dataset.v); const ref = $('[data-k="reference"]', root); if (eq && eq.reference != null && !existing) ref.value = eq.reference; update(); });
    });
    root.addEventListener('input', update); root.addEventListener('click', () => setTimeout(update));
    update();
    const btn = $('[data-save]', root);
    btn.onclick = async () => {
      const err = $('.err', root); err.textContent = '';
      const data = readForm(root, fields);
      // Unticked boxes: confirm before saving them as "not done".
      const unticked = fields.filter(f => f.type === 'tick' && !f.optional && !data[f.k]);
      if (unticked.length && !btn.dataset.armed) {
        const crit = unticked.filter(f => f.critical).length;
        err.textContent = crit ? `${plural(crit, 'critical check')} not ticked. That will record a failed limit.` : `${plural(unticked.length, 'box')} not ticked. They’ll be saved as not done.`;
        arm(btn, 'Tap again to save anyway', 'btn danger full'); return;
      }
      if (btn.dataset.armed) delete btn.dataset.armed;
      if (needInitials) {
        const ini = $('[data-initials]', root).value.trim();
        if (!ini) { err.textContent = 'Add your initials first.'; return; }
        const r = await post({ action: 'fs-settings', initials: ini });
        if (!r.ok) { err.textContent = r.data.error; return; }
        state.safety.settings.initials = ini.toUpperCase();
      }
      const body = { action: 'fs-save', kind, section, batchId: kind === 'corrective' ? ($('[data-batch]', root).value || null) : batchId, data,
        at: new Date($('[data-at]', root).value).toISOString(), replaces: existing?.id, reason: $('[data-reason]', root)?.value };
      btn.disabled = true; const label = btn.innerHTML; btn.textContent = 'Saving…';
      const r = await post(body);
      btn.disabled = false; btn.innerHTML = label;
      if (!r.ok) { err.textContent = r.data.error || 'Couldn’t save that.'; return; }
      const rec = r.data.record;
      // Move on straight away; the rest of the app refreshes in the background.
      Promise.all([loadSafety(), loadBoss()]).then(render);
      if (rec.pass === false && kind !== 'corrective' && !(data.action || '').trim()) {
        toast('Saved. A limit wasn’t met.', true);
        // Straight into the corrective action, filled in with what failed.
        closeSheet();
        setTimeout(() => sheetFsForm({ kind: 'corrective', batchId: kind === 'batch' ? batchId : null,
          prefill: { what: rec.fails.join('; '), limit: kind === 'batch' ? title : KIND_LABEL[kind], found: 'Routine check' } }), 280);
        return;
      }
      toast(r.data.msg || 'Saved', rec.pass === false);
      if (opts.back) opts.back(); else closeSheet();
    };
  }, opts.back);
}

/* ---------- one batch's record ---------- */

      return `<button class="it" data-do="fs-section" data-id="${batchId}" data-section="${s.key}">${icon(s)}<span class="main"><span class="t">${esc(s.title)}</span><span class="d">${sub}</span></span>${CHEV}</button>`;
    }).join('')}</div>`).join('')}
    <label class="f">Release for sale</label>
    <div class="card mb0">${S.release ? `<div class="row"><span class="sdot ok">${TICK}</span><div><b>Released</b><div class="small muted">${when(S.release.at)} · ${esc(S.release.initials)}</div></div></div>` :
      `${release.map(c => `<div class="rel ${c.ok ? 'ok' : ''}"><span class="mini ${c.ok ? 'on' : ''}">${TICK}</span><span>${esc(c.label)}</span></div>`).join('')}
       <button class="btn full mt" data-do="fs-release" data-id="${batchId}" ${release.every(c => c.ok) ? '' : 'disabled'}>Release batch for sale · ${esc(FS().initials || '')}</button>
       ${release.every(c => c.ok) ? '' : '<p class="hint">Everything above needs a tick first.</p>'}`}</div>
    <label class="f">Corrective actions</label>
    <div class="card flush list mb0">${corrective.length ? corrective.map(c => `<button class="it" data-do="fs-record" data-id="${c.id}"><span class="main"><span class="t">${esc(String(c.data.what || '').slice(0, 80))}</span><span class="d">${when(c.at)}</span></span>${resultChip(c)}</button>`).join('') : '<div class="empty">None for this batch.</div>'}</div>
    <button class="btn sec2 full mt" data-do="fs-log" data-kind="corrective" data-batch="${batchId}">Log a corrective action</button>
    ${history.length ? `<p class="hint mt">${plural(history.length, 'earlier version')} kept for this batch. They show on the verifier printout.</p>` : ''}`;
