<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dispatch — Blair's Biltong</title>
<link rel="icon" href="assets/blairs-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#241b13;--ink-2:#150e07;--cream:#efe4d0;--cream-2:#f7f1e4;--cream-3:#e2d5bd;--gold:#b9873c;--kraft:#c9a878;--muted:#6b5b49;--ok:#3f6b3a;--bad:#9a3324}
*{box-sizing:border-box}
body{margin:0;background:var(--cream-3);color:var(--ink);font:400 16px/1.5 'Barlow',Helvetica,Arial,sans-serif}
header{background:var(--ink);border-bottom:4px solid var(--gold);padding:14px 16px;display:flex;align-items:center;gap:12px}
header img{width:44px;height:auto}
header h1{margin:0;font:600 18px/1 'Oswald',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-2)}
header button{margin-left:auto}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font:600 13px/1 'Oswald',sans-serif;letter-spacing:.18em;text-transform:uppercase;margin:22px 0 10px}
.card{background:var(--cream-2);border-radius:8px;padding:16px;margin-bottom:14px;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ref{font:600 13px/1 'Oswald',sans-serif;letter-spacing:.14em;color:var(--gold)}
.name{font:600 19px/1.2 'Oswald',sans-serif;margin:6px 0 2px}
.meta,.addr{color:var(--muted);font-size:14px}
ul{margin:10px 0;padding-left:18px}
label{display:block;font:600 11px/1 'Oswald',sans-serif;letter-spacing:.16em;text-transform:uppercase;margin:12px 0 6px}
input,textarea{width:100%;font:500 16px/1.3 'Barlow',sans-serif;padding:11px 12px;border:1px solid var(--kraft);border-radius:5px;background:#fff;color:var(--ink)}
input.trk{font:600 18px/1 'Oswald',sans-serif;letter-spacing:.06em;text-transform:uppercase}
textarea{min-height:56px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font:600 13px/1 'Oswald',sans-serif;letter-spacing:.12em;text-transform:uppercase;border:0;border-radius:5px;padding:13px 16px;cursor:pointer}
.primary{background:var(--gold);color:var(--ink-2);flex:1}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--kraft)}
header .ghost{color:var(--kraft);border-color:#5a4632;padding:9px 12px}
.danger{background:var(--ink);color:var(--cream-2);flex:1}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:10px;font-size:14px;font-weight:600}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.shipped{opacity:.75}
.pill{display:inline-block;background:var(--ok);color:#fff;font:600 11px/1 'Oswald',sans-serif;letter-spacing:.12em;padding:5px 8px;border-radius:99px;text-transform:uppercase}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
#login{max-width:360px;margin:60px auto}
.hide{display:none}
details summary{cursor:pointer;font:600 13px/1 'Oswald',sans-serif;letter-spacing:.18em;text-transform:uppercase;margin:22px 0 10px}
</style>
</head>
<body>
<header>
  <img src="assets/blairs-logo.png" alt="">
  <h1>Dispatch</h1>
  <button class="ghost hide" id="refresh">Refresh</button>
</header>

<main>
  <section id="login" class="card">
    <label for="pw">Dispatch password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="row"><button class="primary" id="go">Open</button></div>
    <div class="msg bad" id="loginMsg"></div>
  </section>

  <section id="app" class="hide">
    <div class="card">
      <div class="meta">Check the email looks right without needing a real order.</div>
      <div class="row"><button class="ghost" id="sample">Email me a sample</button></div>
      <div class="msg" id="sampleMsg"></div>
    </div>

    <h2>To ship</h2>
    <div id="todo"></div>

    <details>
      <summary>Already shipped</summary>
      <div id="done"></div>
    </details>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let key = '';
try { key = localStorage.getItem('bb-dispatch') || ''; } catch {}

const money = c => '$' + (c / 100).toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = t => new Date(t * 1000).toLocaleDateString('en-NZ', { weekday:'short', day:'numeric', month:'short' });

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-dispatch-key': key, ...(opts.headers || {}) } });
  let data = {}; try { data = await res.json(); } catch {}
  return { status: res.status, ok: res.ok, data };
}

async function load() {
  $('#todo').innerHTML = '<div class="empty">Loading orders…</div>';
  const r = await api('/api/orders');
  if (r.status === 401) { logout('Wrong password.'); return; }
  if (!r.ok) { $('#todo').innerHTML = `<div class="empty">${esc(r.data.error || 'Couldn’t load orders.')}</div>`; return; }
  $('#login').classList.add('hide'); $('#app').classList.remove('hide'); $('#refresh').classList.remove('hide');
  const todo = r.data.orders.filter(o => !o.shippedAt);
  const done = r.data.orders.filter(o => o.shippedAt);
  $('#todo').innerHTML = todo.length ? todo.map(card).join('') : '<div class="empty">Nothing waiting to ship. 🏔</div>';
  $('#done').innerHTML = done.length ? done.map(card).join('') : '<div class="empty">None yet.</div>';
}

function card(o) {
  const shipped = !!o.shippedAt;
  return `<div class="card ${shipped ? 'shipped' : ''}" data-id="${esc(o.id)}">
    <div class="top"><span class="ref">#${esc(o.ref)}</span><span class="meta">${when(o.created)} · ${money(o.total)}</span></div>
    <div class="name">${esc(o.name || o.email)}</div>
    <ul>${o.items.map(i => `<li>${i.qty} × ${esc(i.desc)}</li>`).join('')}</ul>
    <div class="addr">${o.address.map(esc).join('<br>')}</div>
    ${shipped
      ? `<div class="row"><span class="pill">Shipped ${new Date(o.shippedAt).toLocaleDateString('en-NZ')}</span><span class="meta">${esc(o.tracking || '')}</span></div>`
      : `<label>NZ Post tracking number</label>
         <input class="trk" placeholder="e.g. LY123456789NZ" autocapitalize="characters" autocomplete="off">
         <label>Personal note (optional)</label>
         <textarea class="note" placeholder="e.g. Threw in an extra 50 g, enjoy!"></textarea>
         <div class="row">
           <button class="ghost" data-act="test">Test to me</button>
           <button class="primary" data-act="send">Send to customer</button>
         </div>
         <div class="msg"></div>`}
  </div>`;
}

document.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const el = btn.closest('.card'), msg = el.querySelector('.msg');
  const tracking = el.querySelector('.trk').value.trim();
  const note = el.querySelector('.note').value.trim();
  const act = btn.dataset.act;
  if (!tracking) { msg.className = 'msg bad'; msg.textContent = 'Add the tracking number first.'; return; }

  // Two taps to send to a customer: first tap arms it, second sends.
  if (act === 'send' && !btn.dataset.armed) {
    btn.dataset.armed = '1'; btn.className = 'danger'; btn.textContent = 'Tap again to send';
    setTimeout(() => { delete btn.dataset.armed; btn.className = 'primary'; btn.textContent = 'Send to customer'; }, 5000);
    return;
  }

  el.querySelectorAll('button').forEach(b => b.disabled = true);
  msg.className = 'msg'; msg.textContent = 'Sending…';
  const r = await api('/api/mark-shipped', { method: 'POST', body: JSON.stringify({ sessionId: el.dataset.id, tracking, note, test: act === 'test' }) });
  el.querySelectorAll('button').forEach(b => b.disabled = false);
  if (r.ok) {
    msg.className = 'msg ok';
    msg.textContent = act === 'test' ? `Test sent to ${r.data.sentTo}.` : `Sent to ${r.data.sentTo}. Marked as shipped.`;
    if (act === 'send') setTimeout(load, 1500);
  } else {
    msg.className = 'msg bad';
    msg.textContent = r.data.error === 'already_shipped' ? 'This order was already marked shipped.' : (r.data.error || 'Something went wrong.');
  }
});

$('#sample').onclick = async () => {
  const m = $('#sampleMsg'); m.className = 'msg'; m.textContent = 'Sending…';
  const r = await api('/api/mark-shipped', { method: 'POST', body: JSON.stringify({ sample: true }) });
  m.className = 'msg ' + (r.ok ? 'ok' : 'bad');
  m.textContent = r.ok ? `Sample sent to ${r.data.sentTo}. Check your inbox (and spam, the first time).` : (r.data.error || 'Something went wrong.');
};

function logout(text) {
  key = ''; try { localStorage.removeItem('bb-dispatch'); } catch {}
  $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#refresh').classList.add('hide');
  $('#loginMsg').textContent = text || '';
}
$('#go').onclick = () => { key = $('#pw').value; try { localStorage.setItem('bb-dispatch', key); } catch {} load(); };
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
$('#refresh').onclick = load;
if (key) load();
</script>
</body>
</html>
