}


/* ---------- the batch record laid out like the paper form, to copy across ---------- */
async function sheetPaper(batchId) {
  openSheet('Copy to paper', '<div class="skel" style="height:320px"></div>', null, () => sheetFsBatch(batchId));
  await ensureSafety();
  const r = await api('/api/boss?record=' + batchId);
  if (!r.ok) { $('#shBody').innerHTML = `<div class="err">${esc(r.data.error || 'Couldn’t load it.')}</div>`; return; }
  const S = r.data.sections, b = state.data.batches.find(x => x.id === batchId);
  const schema = state.safety.schema.batch;
  const dt = iso => iso ? new Date(iso).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' }) : '';
  const tm = iso => iso ? new Date(iso).toLocaleTimeString('en-NZ', { hour: 'numeric', minute: '2-digit' }).replace(' ', '').toLowerCase() : '';
  const blank = '<span class="pp-blank">—</span>';
  const val = (f, v) => {
    if (v === undefined || v === null || v === '') return blank;
    if (f.type === 'tick') return v ? '<b class="pp-y">Y</b>' : '<b class="pp-n">N</b>';
    return `<b>${esc(v)}${f.unit ? ' ' + esc(f.unit) : ''}</b>`;
  };
  const row = (label, v, pass) => `<div class="pp-row"><span>${label}</span><span>${v}${pass === true ? ' <span class="pp-ok">✓</span>' : pass === false ? ' <span class="pp-bad">✗</span>' : ''}</span></div>`;
  const L = FS().limits;
  const within = (v, max) => v == null || v === '' ? null : Number(v) <= max;
  const signed = x => x ? `<span class="pp-sig">${esc(x.initials || '')} · ${dt(x.at)} ${tm(x.at)}</span>` : '<span class="pp-sig">Not done yet</span>';
  const head = (no, title, x, ccp) => `<div class="pp-h"><span>${no}&nbsp;&nbsp;${esc(title)}${ccp ? ` <span class="crit">${ccp}</span>` : ''}</span>${signed(x)}</div>`;
  const fieldsOf = k => schema.find(x => x.key === k).fields;
  const plain = (k, skip = []) => { const x = S[k]; return fieldsOf(k).filter(f => !['info', 'slices'].includes(f.type) && !skip.includes(f.k)).map(f => {
    const v = x?.data?.[f.k]; const lim = f.limit ? L[f.limit.max] : null;

      ${row('Salt, actual weighed', val({ unit: 'g' }, ms?.data?.saltG), ms ? (ms.result?.derived?.saltPerKg ?? 99) >= L.saltMinPerKg : undefined)}
      ${ms?.result?.derived?.saltPerKg != null ? row('Salt per kg', `<b>${ms.result.derived.saltPerKg} g/kg</b>`) : ''}
      ${row('Malt vinegar, actual weighed', val({ unit: 'g' }, ms?.data?.vinegarG))}
      ${row('Lea &amp; Perrins, actual', val({ unit: 'mL' }, ms?.data?.worcMl))}
      ${row('Meat fully submerged at start', val({ type: 'tick' }, ms?.data?.submerged), ms ? ms.data.submerged === true : undefined)}
      ${row('Start: date / time', ms ? `<b>${dt(ms.at)} · ${tm(ms.at)}</b>` : blank)}
      ${row('Start: chiller', val({ unit: '°C' }, ms?.data?.chillerC), ms ? within(ms.data.chillerC, L.chillerMax) : undefined)}
      ${row('Finish: date / time', me ? `<b>${dt(me.at)} · ${tm(me.at)}</b>` : blank)}

      ${row('Total marinating time', me?.result?.derived?.hours ? `<b>${esc(me.result.derived.hours)}</b>` : blank, me ? me.pass !== false : undefined)}
      ${row('Meat still fully submerged at finish', val({ type: 'tick' }, me?.data?.stillSubmerged), me ? me.data.stillSubmerged === true : undefined)}

      ${row('Finish: date / time', S.drying_end ? `<b>${dt(S.drying_end.at)} · ${tm(S.drying_end.at)}</b>` : blank)}

/* ---------- one saved record ---------- */
async function sheetFsRecord(id) {
  await ensureSafety();
  let r = state.safety.records.find(x => x.id === id);
  if (!r) { await loadSafety(); r = state.safety.records.find(x => x.id === id); }
  if (!r) { toast('Couldn’t find that record', true); return; }
  const fields = r.kind === 'skip' ? [] : state.safety.schema.logs[r.kind].fields;
  const val = (f) => {
    const v = r.data[f.k];
    if (f.type === 'tick') return v ? '<b class="ok-t">Yes</b>' : '<b class="bad-t">No</b>';
    if (f.type === 'checklist') return Object.entries(v || {}).map(([k, x]) => `${esc(k)}: ${x.cleaned ? 'cleaned' : ''}${x.cleaned && x.sanitised ? ' + ' : ''}${x.sanitised ? 'sanitised' : ''}`).join('<br>') || '—';
    if (f.type === 'choice' && f.options === 'calibration') { const e = state.safety.schema.calibration.find(c => c.id === v); return e ? esc(`${e.label}: ${e.check}`) : '—'; }
    return v == null || v === '' ? '<span class="faint">—</span>' : esc(v) + (f.unit ? ' ' + esc(f.unit) : '');
  };
  openSheet(KIND_LABEL[r.kind], `
    <div class="between"><span class="small muted">${when(r.at)} · ${esc(r.initials || '')}${r.code ? ' · ' + esc(r.code) : ''}</span>${resultChip(r)}</div>
    ${(r.result?.fails || []).map(f => `<div class="note" style="margin-top:10px;background:var(--bad-soft);color:var(--bad)"><b>${esc(f)}</b></div>`).join('')}
    <div class="card mt">${r.kind === 'skip' ? `<b>${esc(r.data.title)}</b><p class="muted" style="margin:6px 0 0">Not done: ${esc(r.data.reason)}</p>` :
      fields.map(f => `<div class="kv"><span class="muted">${esc(f.label)}</span><span>${val(f)}</span></div>`).join('')}</div>
    ${r.replaces ? `<p class="hint">This corrects an earlier entry: ${esc(r.reason || '')}</p>` : ''}
    ${r.kind !== 'skip' ? `<button class="btn sec2 full mt" data-do="fs-correct" data-id="${r.id}">${r.kind === 'corrective' && !r.data.closed ? 'Update or close' : 'Correct this record'}</button>` : ''}
    <label class="f">Not valid?</label>
    <div class="row"><input class="in" data-void-reason placeholder="Entered twice by mistake" style="flex:1"><button class="btn danger sm" style="min-height:46px" data-do="fs-void" data-id="${r.id}">Remove</button></div>
    <p class="hint">Removed records are kept and marked “not valid” on the printout, the same as one line through on paper.</p>`);
}

function sheetFsReminders() {
  const s = FS();
  const list = JSON.parse(JSON.stringify(s.reminders));
  const sched = r => r.freq === 'monthly' ? `Monthly on the ${r.monthDay}${['st', 'nd', 'rd'][((r.monthDay + 90) % 100 - 10) % 10 - 1] || 'th'} · ${r.time}`
    : `${r.days.length === 7 ? 'Every day' : r.days.map(d => DAYS[d - 1]).join(', ')} · ${r.time}`;
  const draw = () => {
    $('#shBody').innerHTML = `
      <div class="card"><div class="switch"><div><b>Show reminders in the app</b><div class="small muted">Due checks show on Today and Safety until you log them or mark them not done.</div></div><input type="checkbox" data-master ${s.remindersOn ? 'checked' : ''}></div></div>
      <div class="card flush list">${list.map((r, i) => `<div class="it"><span class="main" data-edit="${i}" style="cursor:pointer"><span class="t">${esc(r.title)}</span><span class="d">${esc(KIND_LABEL[r.kind])} · ${esc(sched(r))}</span></span>
        <label class="switch" style="border:0;padding:0"><input type="checkbox" data-en="${i}" ${r.enabled ? 'checked' : ''} aria-label="On or off"></label></div>`).join('')}</div>
      <button class="btn sec2 full" data-add>${PLUS} Add a reminder</button>
      <div class="err"></div>
      <div class="sh-f"><button class="btn full" data-savereminders>Save reminders</button></div>`;
    const root = $('#shBody');
    $$('[data-en]', root).forEach(c => c.onchange = () => { list[+c.dataset.en].enabled = c.checked; });
    $('[data-master]', root).onchange = e => { s.remindersOn = e.target.checked; };
    $$('[data-edit]', root).forEach(el => el.onclick = () => edit(+el.dataset.edit));
    $('[data-add]', root).onclick = () => { list.push({ id: 'r' + Date.now(), title: 'Fridge temperature check', kind: 'chiller', freq: 'daily', days: [1, 2, 3, 4, 5, 6, 7], time: '12:00', monthDay: 1, enabled: true }); edit(list.length - 1); };
    $('[data-savereminders]', root).onclick = e => act({ action: 'fs-settings', remindersOn: s.remindersOn, reminders: list }, { btn: e.target, errEl: $('.err', root) }).then(x => x && loadSafety());
  };
  const edit = i => {
    const r = list[i];
    $('#shBody').innerHTML = `
      <label class="f">Name</label><input class="in" data-t value="${esc(r.title)}">
      <label class="f">What to log</label>${choiceHtml('kind', [['chiller', 'Fridge temp'], ['cleaning', 'Cleaning'], ['calibration', 'Calibration']], r.kind)}
      <label class="f">How often</label>${choiceHtml('freq', [['daily', 'Daily'], ['weekly', 'Weekly'], ['monthly', 'Monthly']], r.freq)}
      <div data-daysbox><label class="f">On these days</label><div class="choices days">${DAYS.map((d, k) => `<button type="button" data-day="${k + 1}" aria-pressed="${r.days.includes(k + 1)}">${d}</button>`).join('')}</div></div>
      <div data-mdbox><label class="f">Day of the month</label>${stepper('monthDay', r.monthDay || 1, 1)}</div>
      <label class="f">Time</label><input class="in" type="time" data-time value="${esc(r.time)}">
      <div class="btns mt2"><button class="btn sec2" data-back>Back</button><button class="btn" data-ok>Done</button></div>
      <button class="btn quiet full" data-del style="color:var(--bad)">Delete this reminder</button>`;
    const root = $('#shBody');
    const sync = () => { const f = pick(root, 'freq'); $('[data-daysbox]', root).classList.toggle('hide', f === 'monthly'); $('[data-mdbox]', root).classList.toggle('hide', f !== 'monthly'); };
    root.addEventListener('click', e => { const d = e.target.closest('[data-day]'); if (d) d.setAttribute('aria-pressed', d.getAttribute('aria-pressed') !== 'true'); setTimeout(sync); });
    sync();
    $('[data-back]', root).onclick = draw;
    $('[data-del]', root).onclick = () => { list.splice(i, 1); draw(); };
    $('[data-ok]', root).onclick = () => {
      Object.assign(r, { title: $('[data-t]', root).value.trim() || 'Check', kind: pick(root, 'kind'), freq: pick(root, 'freq'),
        days: $$('[data-day][aria-pressed="true"]', root).map(b => +b.dataset.day), monthDay: +$('[name=monthDay]', root).value || 1, time: $('[data-time]', root).value || '09:00' });
      if (r.freq !== 'monthly' && !r.days.length) r.days = [1, 2, 3, 4, 5, 6, 7];
      draw();
    };
  };
  openSheet('Reminders', ''); draw();
}

/* ================================================================== RECIPE CALCULATOR
   Trimmed weight in → everything to weigh out for the marinade and spice mix. */
const RECIPE_DEFAULT = { salt: 40, vinegar: 100, worcestershire: 60, coriander: 40, pepper: 26.7, chilli: null, spiceOnMeat: 50 };
const recipeNow = () => ({ ...RECIPE_DEFAULT, ...(state.safety?.settings?.recipe || {}) });
function recipeLines(kg, flavour) {
  const R = recipeNow(), x = v => Math.round(kg * v);
  const marinade = [['salt', 'Salt (iodised)', x(R.salt), 'g'], ['vinegar', 'Malt vinegar', x(R.vinegar), 'g'], ['worcestershire', 'Lea & Perrins', x(R.worcestershire), 'mL']];
  const spice = [['coriander', 'Coriander seed', x(R.coriander), 'g'], ['pepper', 'Black pepper', x(R.pepper), 'g']];
  if (flavour === 'dryheat') spice.push(['chilli', 'Chilli', R.chilli ? x(R.chilli) : null, 'g']);
  return { marinade, spice, spiceTotal: spice.reduce((a, l) => a + (l[2] || 0), 0), R };
}
const recipeShort = (kg, flavour) => { const r = recipeLines(kg, flavour); return `Salt ${r.marinade[0][2]} g · vinegar ${r.marinade[1][2]} g · L&amp;P ${r.marinade[2][2]} mL · spice ${r.spiceTotal} g`; };

async function sheetRecipe(pre = {}) {
  await ensureSafety();
  const fl = pre.flavour || (state.data.flavours.find(f => f.id === 'original') || state.data.flavours[0]).id;
  openSheet('Recipe', `
    <label class="f">Trimmed weight</label>
    <div class="bignum" style="height:76px"><button type="button" data-nudge="-0.5" aria-label="Less">−</button>
      <input data-kg inputmode="decimal" value="${pre.kg ?? ''}" placeholder="0.0"><span class="u">kg</span>
      <button type="button" data-nudge="0.5" aria-label="More">+</button></div>
    <div class="mt">${choiceHtml('rflav', state.data.flavours.map(f => [f.id, f.label]), fl)}</div>
    <div id="recipeOut"></div>
    <details class="more"><summary>Edit the recipe</summary><div class="card" id="recipeEdit"></div></details>`, root => {
    const draw = () => {
      const inp = $('[data-kg]', root); if (!inp) return;
      const kg = parseFloat(inp.value.replace(',', '.')), flavour = pick(root, 'rflav');
      const out = $('#recipeOut', root);
      if (!(kg > 0)) { out.innerHTML = '<div class="card empty mt">Type the trimmed weight to see what to weigh out.</div>'; return; }
      const r = recipeLines(kg, flavour);
      const ticked = new Set($$('.tick.on', out).map(t => t.dataset.k));
      const row = ([k, label, amt, unit]) => amt == null
        ? `<div class="tick" style="cursor:default;opacity:.75"><span class="box"></span><span class="lbl">${esc(label)}<br><span class="small muted">No amount set yet. Add it under Edit the recipe.</span></span></div>`
        : `<button type="button" class="tick ${ticked.has(k) ? 'on' : ''}" data-tick data-k="${k}"><span class="box">${TICK}</span><span class="lbl" style="flex:1">${esc(label)}</span><b class="amt">${amt.toLocaleString('en-NZ')} ${unit}</b></button>`;
      out.innerHTML = `
        <label class="f">Marinade <span class="lim">meat fully submerged</span></label>${r.marinade.map(row).join('')}
        <label class="f">Spice mix <span class="lim">${r.spiceTotal.toLocaleString('en-NZ')} g blend · applied the next morning</span></label>${r.spice.map(row).join('')}
        ${r.R.spiceOnMeat ? `<div class="info-row"><span class="muted">Aim to leave on the meat</span><b>${Math.round(kg * r.R.spiceOnMeat).toLocaleString('en-NZ')} g <span class="muted small">(${r.R.spiceOnMeat} g/kg)</span></b></div>` : ''}
        <p class="hint">Per kg: salt ${r.R.salt} g · vinegar ${r.R.vinegar} g · Lea &amp; Perrins ${r.R.worcestershire} mL · coriander ${r.R.coriander} g · pepper ${r.R.pepper} g${flavour === 'dryheat' ? ` · chilli ${r.R.chilli ?? 'not set'}${r.R.chilli ? ' g' : ''}` : ''}. Salt critical limit ${FS().limits.saltMinPerKg ?? 30} g/kg.</p>
        ${pre.batchId ? `<button class="btn sec2 full mt" data-do="fs-section" data-id="${pre.batchId}" data-section="marinate_start" data-fromrecipe="1">Record it in the batch record</button>` : ''}`;
    };
    const R = recipeNow();
    const ed = (k, label, unit) => `<div class="packrow"><div><b>${label}</b><div class="small muted">${unit} per kg</div></div><input class="in" style="text-align:center" inputmode="decimal" data-rk="${k}" value="${R[k] ?? ''}"></div>`;
    $('#recipeEdit', root).innerHTML = `${ed('salt', 'Salt', 'g')}${ed('vinegar', 'Malt vinegar', 'g')}${ed('worcestershire', 'Lea & Perrins', 'mL')}${ed('coriander', 'Coriander seed', 'g')}${ed('pepper', 'Black pepper', 'g')}${ed('chilli', 'Chilli (Dry Heat)', 'g')}${ed('spiceOnMeat', 'Spice left on the meat', 'g target')}
      <p class="hint">Change these only when your recipe and food control plan change. Salt can’t go below the ${FS().limits.saltMinPerKg ?? 30} g/kg critical limit.</p>
      <div class="err"></div><button class="btn sec2 full mt" data-saverecipe>Save recipe</button>`;
    $('[data-saverecipe]', root).onclick = async e => {
      const recipe = Object.fromEntries($$('[data-rk]', root).map(i => [i.dataset.rk, i.value.trim()]));
      if (Number(recipe.salt) < (FS().limits.saltMinPerKg ?? 30)) { $('#recipeEdit .err', root).textContent = 'Salt is below your critical limit.'; return; }
      const r = await post({ action: 'fs-settings', recipe });
      if (!r.ok) { $('#recipeEdit .err', root).textContent = r.data.error; return; }
      await loadSafety(); toast('Recipe saved'); draw();
    };
    $('[data-kg]', root).addEventListener('input', draw);
    root.addEventListener('click', e => { if (e.target.closest('[data-nudge],.choices[data-name="rflav"]')) setTimeout(draw); });
    draw();
  });
}

/* ================================================================== EVENTS */
document.addEventListener('click', async e => {
  const t = e.target;
  const tab = t.closest('nav.tabs button'); if (tab) { setTab(tab.dataset.tab); if (tab.dataset.tab === 'orders' && !state.loading) loadOrders(); return; }
  const go = t.closest('[data-tab-go]'); if (go) { if (go.dataset.seg) state.stockSeg = go.dataset.seg; setTab(go.dataset.tabGo); return; }
  const seg = t.closest('[data-seg]'); if (seg && seg.closest('#view')) { state.stockSeg = seg.dataset.seg; render(); return; }
  const per = t.closest('[data-period]'); if (per) { state.period = per.dataset.period; render(); return; }
  const ship = t.closest('[data-ship]'); if (ship) { shipAction(ship); return; }
  const pst = t.closest('[data-postage]'); if (pst) {
    const card = pst.closest('.order'), v = $('.post-in', card).value.trim();
    if (!v) { $('.post-in', card).focus(); return; }
    pst.disabled = true;
    const r = await post({ action: 'postage-set', sessionId: card.dataset.id, postage: v });
    pst.disabled = false;
    toast(r.data.msg || r.data.error, !r.ok);
    if (r.ok) { await loadOrders(); refreshBoss(); }
    return;
  }
  const flt = t.closest('[data-fsfilter]'); if (flt) { state.fsFilter = flt.dataset.fsfilter; render(); return; }
  const tk = t.closest('[data-tick]'); if (tk) { tk.classList.toggle('on'); tk.setAttribute('aria-pressed', tk.classList.contains('on')); return; }
  const mini = t.closest('button.mini'); if (mini) { mini.classList.toggle('on'); return; }
  const allc = t.closest('[data-allclean]'); if (allc) { const on = !$$('.clist .mini', allc.parentElement).every(m => m.classList.contains('on')); $$('.clist .mini', allc.closest('.clist')).forEach(m => m.classList.toggle('on', on)); return; }
  const adds = t.closest('[data-addslice]'); if (adds) { const box = $('[data-slices]', adds.parentElement); if ($$('.sl-r', box).length < 20) box.insertAdjacentHTML('beforeend', sliceRow({}, $$('.sl-r', box).length)); return; }
  const ndg = t.closest('[data-nudge]'); if (ndg) { const i = $('input', ndg.parentElement); const v = parseFloat(i.value || '4') + +ndg.dataset.nudge; i.value = Math.round(v * 10) / 10; i.dispatchEvent(new Event('input', { bubbles: true })); return; }
  const ch = t.closest('.choices button'); if (ch && !ch.closest('.days')) { $$('button', ch.parentElement).forEach(b => b.setAttribute('aria-pressed', b === ch)); return; }
  const st = t.closest('.stepper button'); if (st) {
    const i = $('input', st.parentElement); const min = +i.dataset.min || 0;
    i.value = Math.max(min, (parseInt(i.value, 10) || 0) + +st.dataset.step); i.dispatchEvent(new Event('input', { bubbles: true })); return;
  }
  if (t.closest('#scrim')) { closeSheet(); return; }
  const el = t.closest('[data-do]'); if (!el) return;
  const id = el.dataset.id ? +el.dataset.id : null;
  switch (el.dataset.do) {
    case 'close': closeSheet(); break;
    case 'adjust': {
      const pre = { sku: el.dataset.sku, dir: el.dataset.dir };
      if ($('#sheet').classList.contains('on')) { closeSheet(); setTimeout(() => sheetAdjust(pre), 270); } else sheetAdjust(pre);
      break;
    }
    case 'stocktake': sheetStocktake(); break;
    case 'sku': sheetSku(el.dataset.sku); break;
    case 'start-batch': sheetStartBatch(); break;
    case 'batch': sheetBatch(id); break;
    case 'pack': if ($('#sheet').classList.contains('on')) { closeSheet(); setTimeout(() => sheetPack(id), 270); } else sheetPack(id); break;
    case 'advance': await act({ action: 'batch-status', id, status: el.dataset.to }, { close: $('#sheet').classList.contains('on') }); break;
    case 'close-batch': await act({ action: 'batch-status', id, status: 'closed' }); break;
    case 'reopen-batch': await act({ action: 'batch-status', id, status: 'packed' }); break;
    case 'unpack': if (arm(el, 'Tap again to undo packing')) await act({ action: 'batch-unpack', id }); break;
    case 'delete-batch': if (arm(el, 'Tap again to delete')) await act({ action: 'batch-delete', id }); break;
    case 'undo': if (arm(el, 'Sure?')) await act({ action: 'undo', id }, { close: false }); break;
    case 'supply': sheetSupply(id); break;
    case 'supply-new': sheetSupplyNew(); break;
    case 'archive-supply': if (arm(el, 'Tap again to remove')) await act({ action: 'supply-archive', id }); break;
    case 'test-alert': { el.disabled = true; const r = await post({ action: 'test-alert' }); el.disabled = false; toast(r.data.msg || r.data.error, !r.ok); break; }
    case 'waitlist-send': if (arm(el, 'Tap to send')) await act({ action: 'waitlist-send', flavour: el.dataset.flavour }); break;
    case 'waitlist-view': closeSheet(); setTimeout(sheetWaitlist, 270); break;
    case 'waitlist-remove': { const r = await post({ action: 'waitlist-remove', id }); if (r.ok) el.closest('.it').remove(); break; }
    case 'sample': {
      const m = $('#sampleMsg'); m.className = 'msg'; m.textContent = 'Sending…';
      const r = await api('/api/mark-shipped', { method: 'POST', body: JSON.stringify({ sample: true }) });
      m.className = 'msg ' + (r.ok ? 'ok' : 'bad');
      m.textContent = r.ok ? `Sample sent to ${r.data.sentTo}. Check your inbox (and spam, the first time).` : (r.data.error || 'Something went wrong.');
      break;
    }
    case 'logout': closeSheet(); logout(''); break;
    case 'fs-log': {
      const open = () => sheetFsForm({ kind: el.dataset.kind, batchId: el.dataset.batch ? +el.dataset.batch : null });
      if ($('#sheet').classList.contains('on')) { closeSheet(); setTimeout(open, 270); } else open();
      break;
    }
    case 'fs-skip': sheetFsSkip(el.dataset.id); break;
    case 'fs-batch': if ($('#sheet').classList.contains('on')) { closeSheet(); setTimeout(() => sheetFsBatch(id), 270); } else sheetFsBatch(id); break;
    case 'fs-section': {
      if (el.dataset.fromrecipe || state.fsBatchCtx?.batchId !== id) {
        closeSheet(); await new Promise(r => setTimeout(r, 270)); await sheetFsBatch(id);
      }
      const c = state.fsBatchCtx, ex = c.sections[el.dataset.section];
      // A finished section opens as a correction; a part-done one just carries on.
      sheetFsForm({ kind: 'batch', section: el.dataset.section, batchId: id, sections: c.sections, back: c.back,
        existing: ex && ex.pass !== null ? ex : null, prefill: ex && ex.pass === null ? ex.data : null, });
      break;
    }
    case 'fs-release': {
      if (!arm(el, 'Tap again to release')) break;
      el.disabled = true;
      const r = await post({ action: 'fs-save', kind: 'batch', section: 'release', batchId: id, data: {} });
      el.disabled = false;
      if (!r.ok) { toast(r.data.error, true); break; }
      toast('Batch released for sale'); await Promise.all([loadSafety(), loadBoss()]); render(); sheetFsBatch(id);
      break;
    }
    case 'fs-record': if ($('#sheet').classList.contains('on')) { closeSheet(); setTimeout(() => sheetFsRecord(id), 270); } else sheetFsRecord(id); break;
    case 'fs-correct': { const r = state.safety.records.find(x => x.id === id); closeSheet(); setTimeout(() => sheetFsForm({ kind: r.kind, existing: r, batchId: r.batch_id }), 270); break; }
    case 'fs-void': {
      const reason = $('[data-void-reason]').value.trim();
      if (!reason) { $('[data-void-reason]').focus(); toast('Say why it’s not valid first', true); break; }
      if (!arm(el, 'Sure?')) break;
      if (await act({ action: 'fs-void', id, reason })) loadSafety();
      break;
    }
    case 'recipe': {
      const b = id ? state.data.batches.find(x => x.id === id) : null;
      const pre = { batchId: b?.id, flavour: b?.flavour, kg: el.dataset.kg ? +el.dataset.kg : b?.raw_kg };
      if ($('#sheet').classList.contains('on')) { closeSheet(); setTimeout(() => sheetRecipe(pre), 270); } else sheetRecipe(pre);
      break;
    }
    case 'fs-paper': sheetPaper(id); break;
    case 'show-noted': state.showNoted = !state.showNoted; render(); break;
    case 'alert-snooze': {
      el.disabled = true;
      const key = el.dataset.key;
      const r = await post({ action: 'alert-snooze', key, days: 3 });
      if (!r.ok) { el.disabled = false; toast(r.data.error, true); break; }
      await refreshBoss();
      toast('Hidden for 3 days', false, { label: 'A week', fn: async () => { await post({ action: 'alert-snooze', key, days: 7 }); toast('Hidden for a week'); refreshBoss(); } });
      break;
    }
    case 'alert-unsnooze': await act({ action: 'alert-snooze', key: el.dataset.key, undo: true }, { close: false }); break;
    case 'supply-ordered': {
      el.disabled = true;
      const r = await post({ action: 'supply-ordered', id });
      if (!r.ok) { el.disabled = false; toast(r.data.error, true); break; }
      if ($('#sheet').classList.contains('on')) closeSheet();
      await refreshBoss();
      toast(r.data.msg + '. You’ll get a reminder to log it.', false, { label: 'Undo', fn: async () => { await post({ action: 'supply-ordered', id, cancel: true }); refreshBoss(); } });
      break;
    }
    case 'supply-arrived': sheetSupply(id); break;
    case 'fs-reminders': sheetFsReminders(); break;
    case 'fs-settings': sheetFsSettings(); break;
    case 'fs-print': sheetFsPrint(); break;
    case 'fs-backup': fsBackup(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet();
  if (e.key === 'Enter' && e.target.matches('[role=button][data-do]')) e.target.click();
});

function logout(text) {
  key = ''; try { localStorage.removeItem('bb-dispatch'); } catch {}
  state.data = null; state.orders = null;
  $('#view').classList.add('hide'); $('#tabs').classList.add('hide'); $('#login').classList.remove('hide');
  $('#refresh').classList.add('hide'); $('#settingsBtn').classList.add('hide');
  $('#title').textContent = 'Dispatch'; $('#loginMsg').textContent = text || '';
}
$('#go').onclick = () => { key = $('#pw').value; try { localStorage.setItem('bb-dispatch', key); } catch {} loadAll(true); };
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
$('#refresh').onclick = () => loadAll(false);
$('#settingsBtn').onclick = () => state.data && sheetSettings();
// Coming back to the app after a while: pull fresh numbers.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && key && state.data) loadAll(false); });
if (key) loadAll(true);
</script>
</body>
</html>
