<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order confirmed — Blair's Biltong</title>
<link rel="icon" href="assets/blairs-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',system-ui,sans-serif;background:#150e07;color:#efe4d0;
  min-height:100vh;display:grid;place-items:center;padding:40px 24px;text-align:center;line-height:1.6}
img.logo{width:150px;margin:0 auto 34px}
h1{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:clamp(1.9rem,5vw,3rem);line-height:1.05;margin-bottom:18px}
.rule{width:60px;height:4px;background:#b9873c;margin:0 auto 24px}
p{max-width:44ch;margin:0 auto 14px;color:rgba(239,228,208,.78)}
.ref{font-family:'Oswald',sans-serif;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(239,228,208,.4);margin-top:26px;word-break:break-all}
a.btn{display:inline-flex;margin-top:30px;background:#b9873c;color:#fff;padding:15px 32px;
  font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.12em;
  font-size:.85rem;text-decoration:none;border-radius:2px}
a.btn:hover{background:#d4a556}
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/blairs-logo.png" alt="Blair's Biltong">
  <h1>Order confirmed</h1>
  <div class="rule"></div>
  <p>Thanks for the order — proper legend. A confirmation email is on its way to you.</p>
  <p id="fulfilMsg">We hand pack every order in Queenstown. Yours will be on its way within one to two business days.</p>
  <a class="btn" href="/">Back to the shop</a>
  <div class="ref" id="ref"></div>
</main>
<script>
  // The order went through, so the saved cart is stale — clear it or the items
  // reappear next time they open the shop.
  try { localStorage.removeItem('bb_cart_v1'); } catch {}

  const params = new URLSearchParams(location.search);
  const id = params.get('session_id');
  if (id) document.getElementById('ref').textContent = 'Reference: ' + id.slice(-12);

  // Local pickup orders aren't posted — swap the delivery line for collection wording.
  if (params.get('pickup') === '1') {
    document.getElementById('fulfilMsg').textContent =
      "This one's a local pickup, so there's nothing to post. We'll be in touch shortly to sort a time and place to hand it over.";
  }
</script>
</body>
</html>
